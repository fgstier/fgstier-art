    function generateSeoSlug(title) {
        return title
            .toLowerCase()
            .trim()
            .replace(/ä/g, 'ae')
            .replace(/ö/g, 'oe')
            .replace(/ü/g, 'ue')
            .replace(/ß/g, 'ss')
            .replace(/[^a-z0-9 -]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-');
    }

   document.addEventListener("DOMContentLoaded", () => {
    const grid = document.getElementById('thumbnail-grid');
    
    youtubeVideos.forEach(video => {
        const seoSlug = generateSeoSlug(video.Title);
        
        // Lokaler SEO-Pfad als erste Priorität
        const localImagePath = `image/${seoSlug}.jpg`;
        // Offizieller YouTube-Pfad als sicherer Fallback, falls das lokale Bild fehlt
        const fallbackImagePath = `https://img.youtube.com/vi/${video.VideoId}/hqdefault.jpg`;
        
        const altText = `F.G. Stier – ${video.Title}`;

        const card = document.createElement('div');
        card.className = 'thumb-card rounded-xl overflow-hidden border border-sky-900/50 bg-black/60 p-2 flex flex-col justify-between';

        card.innerHTML = `
            <a href="${video.Url}" target="_blank" class="block rounded-lg overflow-hidden relative group">
                <img src="${localImagePath}" 
                     alt="${altText}" 
                     loading="lazy" 
                     width="480" 
                     height="270"
                     onerror="this.onerror=null; this.src='${fallbackImagePath}';"
                     class="w-full h-auto object-cover aspect-video bg-slate-900 transition group-hover:brightness-110">
                
                <div class="absolute bottom-2 right-2 bg-black/80 text-sky-400 text-[10px] font-mono px-2 py-0.5 rounded border border-sky-500/30">
                    <i class="fa-solid fa-play text-[8px] mr-1"></i> VIDEO
                </div>
            </a>
            <div class="mt-3 px-1 mb-1">
                <h2 class="text-xs font-mono text-slate-300 font-semibold line-clamp-2">
                    ${video.Title}
                </h2>
            </div>
        `;

        grid.appendChild(card);
    });
});
