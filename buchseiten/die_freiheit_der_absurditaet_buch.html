<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Buch Test-Umgebung</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #141923;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(26, 31, 41, 0.85);
            padding: 15px 20px;
            border-radius: 6px;
            z-index: 10;
            pointer-events: none;
            border-left: 4px solid #4a90e2;
            max-width: 350px;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .footer-tag {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #4a5568;
            font-family: monospace;
            font-size: 12px;
            z-index: 10;
        }
    </style>
    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>

    
    <div id="canvas-container"></div>

    <div class="footer-tag">#ARKUSNAT #fgstier #shorts #scifi #ai #ki</div>

    <script>
	
	// Erzeugt eine winzige Textur mit feinen Linien für den Seitenstapel-Effekt
const createPaperRillenTexture = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    const ctx = canvas.getContext('2d');
    
    // Hintergrund (Papierfarbe)
    ctx.fillStyle = '#f4f1ea'; 
    ctx.fillRect(0, 0, 16, 16);
    
    // Feine Schattenlinien für die Seitenstruktur
    ctx.fillStyle = '#e5decf'; 
    ctx.fillRect(0, 2, 16, 2);
    ctx.fillRect(0, 8, 16, 2);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    // Die Textur wird stark wiederholt, um extrem feine Linien zu erzeugen
    texture.repeat.set(50, 50); 
    return texture;
};
const rillenTexture = createPaperRillenTexture();
const farbePapierseiten = 0xf4f1ea; // Creme-Weiß

const papierMaterial = new THREE.MeshStandardMaterial({ 
    color: farbePapierseiten,
    bumpMap: rillenTexture,  // Aktiviert die Struktur
    bumpScale: 0.05,         // Wie tief die Rillen wirken (fein justierbar)
    roughness: 0.8           // Macht das Papier schön matt
});
	
        // --- 1. Basis Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. Beleuchtung (Für schöne plastische Schatten auf den Kanten) ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 4);
        scene.add(mainLight);

        const backlight = new THREE.DirectionalLight(0xffffff, 0.4);
        backlight.position.set(-5, -3, -5);
        scene.add(backlight);

        // --- 3. Texturen per Canvas generieren (Ersatz für deine lokalen JPEGs zum sofortigen Testen) ---
        function createTestImage(title, sub, baseColor, textColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 550;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grafischer Effekt/Muster auf dem Cover
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for(let i=0; i<canvas.height; i+=30) {
                ctx.fillRect(0, i, canvas.width, 15);
            }

            ctx.strokeStyle = textColor;
            ctx.lineWidth = 8;
            ctx.strokeRect(15, 15, canvas.width-30, canvas.height-30);

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText(title, canvas.width / 2, canvas.height / 3);

            ctx.font = '14px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText(sub, canvas.width / 2, canvas.height / 2);
            ctx.fillText("TEXT LAEUFT KORREKT ODER?", canvas.width / 2, canvas.height / 1.7);
            
            return new THREE.CanvasTexture(canvas);
        }

        // 1. Loader initialisieren
const loader = new THREE.TextureLoader();
// 2. Deine drei echten Bilddateien aus dem Unterordner "buchseiten" laden
const textureCover = loader.load('die_freiheit_der_absurditaet_vorn.jpg'); 
const textureBack  = loader.load('die_freiheit_der_absurditaet_hinten.jpg');  
const textureSpine = loader.load('die_freiheit_der_absurditaet_ruecken.jpg');  

const materials = [
    papierMaterial, // Rechts (Papier)
    new THREE.MeshStandardMaterial({ map: textureSpine }),  // Links (Rücken)
    papierMaterial, // Oben (Papier)
    papierMaterial, // Unten (Papier)
    new THREE.MeshStandardMaterial({ map: textureCover }),            // Vorne (Cover)
    new THREE.MeshStandardMaterial({ map: textureBack }) // Hinten (Backcover)
];


        // --- 5. Geometrie (Breite, Höhe, Dicke) ---
        // Die Texturen passen sich automatisch diesen Werten an!
        const geometry = new THREE.BoxGeometry(4.0, 5.5, 0.25);
        const bookMesh = new THREE.Mesh(geometry, materials);
        scene.add(bookMesh);

        bookMesh.rotation.x = 0.15; // Schick gekippt starten

        // --- 6. Interaktive Maussteuerung ---
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - prevMouse.x;
            const deltaY = e.clientY - prevMouse.y;

            bookMesh.rotation.y += deltaX * 0.005;
            bookMesh.rotation.x += deltaY * 0.005;

            prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 7. Animations-Schleife ---
        function animate() {
            requestAnimationFrame(animate);

            // Automatische sanfte Drehung, wenn der Nutzer das Buch nicht festhält
            if (!isDragging) {
                bookMesh.rotation.y += 0.018;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
