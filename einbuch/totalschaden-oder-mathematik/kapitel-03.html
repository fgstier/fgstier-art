<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Totalschaden oder Mathematik-022.jpg', alt: "Der Abstieg in den KellerDer Weg zum Institut für Teilchenphysik führt nicht über eine glanzvolle Pforte, sondern über eine unscheinbare Stahltür im Nordflügel, die den Charme einer Bunkeranlage versprüht. Vargo S. steht davor, das schmutzige Handbuch fest unter den Arm geklemmt. Sein Ausweis, das Plastiksymbol seiner Zuge-hörigkeit zur „Elite“, gewährt ihm zwar Zutritt zum Gebäude, doch je tiefer er die Treppen hinuntersteigt, desto weniger scheint dieses Stück Kunststoff wert zu sein.Die Fahrstühle meidet er. Eventuell gibt es dort Kameras oder unwillkürlich zusteigende Passagiere, die ein Gespräch anfangen könnten. Er will die Stufen spüren, will einmal den Übergang von der klimatisierten Reinheit der Vorlesungssäle zur stickigen, ölgeladenen Luft des Untergeschosses physisch vollziehen. Mit jedem Stockwerk, das er tiefer sinkt, verstummt das ferne Summen der Serverfarmen. Hier unten dominiert ein tieffrequentes Grollen – das Atmen der Vakuumpumpen, das" },
            { src: 'Totalschaden oder Mathematik-023.jpg', alt: "mechanische Herz des Beschleunigers. Es roch nach dickem Fett und Schmiere, dessen Gestank er schon längst vergessen hatte. Es war abenteuerlich, dieses Gefühl für Mechanik, Ge-triebe und Förderband zu spüren. Das Licht hier im Treppen-haus war nicht gerade üppig ausleuchtend. Überall versuchten Schatten und kuriose Spiegelungen des Lichtes, die Umgebung in eine Landschaft der urwäldlichen Fabriken spielerisch aus-zuleuchten.Vargo erreicht eine schwere Brandschutztür, über der ein Schild mit der Aufschrift „Sektor 0 – Instandhaltung & Kryo-Technik“ prangt. Die Schrift war kaum zu lesen und auch etwas rostig anzusehen. Als er eintreten will, versperrt ihm kein digi-taler Scanner den Weg, sondern ein massiver Holz-Schreibtisch aus uralten Instituts-Beständen, hinter dem ein Mann sitzt, der so gar nicht in das Bild eines modernen Forschungszentrums passt. Er tippte mit seinen Zeigefingern irgendwelche Zahlen auf der Tastatur ein und war damit beschäftigt die Zahlen im Monitor verfolgen zu können. Seine Brille lag derweil auf dem Tisch herum.Das ist Meister Kahl. Er trägt einen graublauen Kittel, der von jahrzehntelanger Arbeit mit Graphitschmiere und Hydrau-liköl gezeichnet ist. Seine Hände sind keine „Lerncomputer“, sie sind Werkzeuge mit Narben und Schwielen. Er starrt ab-wechselnd auf den Monitor und ein vor ihm liegendes zerleg-tes Ventil, dessen Innereien über den Tisch verteilt sind. Es konnte gut sein, dass das Vehikel auch ein Motor oder Getriebe war. So genau wollte es Vargo auch nicht wissen.„Wo willst’n du hin, Student?“, fragt Kahl, ohne aufzusehen. Seine Stimme klingt wie Schmirgelpapier auf Beton. „Die klu-gen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
