<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Totalschaden oder Mathematik-043.jpg', alt: "Die springenden LemmingeIn der klassischen Kernphysik stellt man sich den Zerfall von Atomen als ein Spiel mit dem Zufall vor. Hier sind nur drei Säulen dieser Vorstellung:1. Die Instabilität als Potenzial: Ein instabiler Kern (wie Uran oder Cäsium) wird als ein System betrachtet, das „zu viel“ Energie gespeichert hat. Er befindet sich in einem angeregten Zustand. Die Wissenschaft sagt: Das Atom strebt nach einem energetischen Minimum. Es will zur Ruhe kommen. Der Zerfall ist der gewaltsame Akt, diese überschüssige Energie loszu-werden – meist durch das Ausspucken von Alpha-Teilchen, Elektronen (Beta) oder hochenergetischen Photonen (Gamma).2. Der Quantentunnel: Die Flucht aus dem Gefängnis. Wa-rum zerfällt ein Atom genau jetzt und nicht schon vor einer Million Jahren? Die Antwort der Elite lautet: Quantentunneln. Das Teilchen im Kern ist wie ein Gefangener hinter einer zu hohen Mauer" },
            { src: 'Totalschaden oder Mathematik-044.jpg', alt: "(der Potentialwall). Laut klassischer Physik könnte es niemals entkommen. Aber die Quantenmechanik erlaubt es dem Teil-chen, die Mauer einfach zu „durchtunneln“. Es verschwindet drinnen und taucht draußen wieder auf.3. Die Herrschaft der Halbwertszeit. Das ist der Punkt, an dem die Exponentialfunktion wieder ins Spiel kommt. Die Wissenschaft behauptet, man könne niemals sagen, wann ein einzelnes Atom zerfällt. Man kann nur sagen, wie lange es dau-ert, bis die Hälfte einer großen Gruppe (die Lemminge) ge-sprungen ist. Es gibt keine Kausalität für den Einzelnen. Es gibt nur eine statistische Wahrscheinlichkeit für die Masse.Der Zerfall wird als rein stochastischer Prozess verkauft – ein würfelndes Universum, das keine Hardware-Fehler kennt, sondern nur „Zufall“. Die totale Gleichheit bei absoluter Indi-vidualität. In der Wissenschaft nennt man das die Ununter-scheidbarkeit von Elementarteilchen. Das ist „echte“ Wissen-schaft, aber sie fühlt sich an wie ein absurdes Theaterstück. Ein Tritium-Kern, der seit 10 Jahren existiert, hat in der nächsten Sekunde exakt die gleiche Wahrscheinlichkeit zu zerfallen wie ein Kern, der gerade erst entstanden ist. Man nennt das Ge-dächtnislosigkeit. Es gibt keine „Alterung“. Jeder Kern springt über die Klinge, nicht weil er „dran“ ist, sondern weil er in je-dem Moment würfelt – und die Wahrscheinlichkeit k ist für alle Kerne der gleichen Sorte (z.B. C14) identisch.Dass man nie beobachtet, wie plötzlich 10% der Teilchen gleichzeitig „kollektiv Suizid“ begehen, liegt an einem Gesetz," }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
