<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Totalschaden oder Mathematik-119.jpg', alt: "Nachwort des AutorsDieses Werk versteht sich als konsequente Fortsetzung der ge-danklichen Linien, die in „DIE QUANTEN-LÜGE“, „Die Hin-richtung der Kausalität“ und „Das Prinzip der zeitlosen Ver-ursachung“ ihren Anfang nahmen. Es ist mehr als eine Erzäh-lung; es ist eine literarische Laborsituation, in der die Grenzen zwischen technischer Kybernetik, Quantenphysik und Exis-tenzphilosophie aufgelöst werden.Die hier aufgeworfenen Fragen – von der trügerischen Natur des Poynting-Vektors bis hin zur ontologischen Überlegenheit der Prim-Singularität gegenüber der multiplikativen Zwangs-bildung – fordern eine Antwort, die außerhalb der Lehrbuch-verordnungen liegt. Wenn die Welt, wie Vargo es erfahren hat, tatsächlich nur aus isolierten Prim-Ereignissen besteht, die un-ser Geist mühsam zu Wellen und Geschichten verwebt, dann ist dieses Buch ein Werkzeug zur Befreiung von der Illusion der Vorhersehbarkeit.Als technischer Autor nutze ich die inimitable temptation der Worte als Bildmaschine. Dieses Werk dient als philosophi-sche Analyse und literarische Dekonstruktion der Begriffe „Nichts“, „Existenz“ und „Code“. Es ist die logische Veranke-rung eines wissenschaftlich-philosophischen Konzepts, das uns zwingt, die eigene Wahrnehmung als das zu erkennen, was sie ist: Eine fehlerhafte Kompilation in einem Universum, das kei-ne Fehler kennt – sondern nur das nächste, unteilbare Jetzt." },
            { src: 'Totalschaden oder Mathematik-007.jpg', alt: "PROLOGWir stehen auf einer Brücke, die bereits eingestürzt ist, und versuchen, die Trümmer mit den dünnen Fäden der Analysis zusammenzuhalten. Wir nennen es „Berechnung“, doch in Wahrheit ist es eine ordnungstherapeutische Verzweiflung. Die moderne Mathematik ist diese Krücke. Sie ist das hölzerne Ge-stell, das wir in den Schlamm der Erscheinungen rammen, um so zu tun, als gäbe es einen festen Boden, einen fließenden Übergang, ein logisches Danach. Wir klammern uns an das winzige Zeitintervall dt, als wäre es ein Rettungsanker im Oze-an des NPI-Gitters. Dieser Taktgeber ist ein Schmuggelgut. Es ist die illegale Infiltration der Dynamik in ein Universum, das in seiner Perstanz längst erstarrt ist. In diesem Buch wird die Mathematik nicht als Werkzeug der Erkenntnis, sondern als Sprache des Zirkelschlusses entlarvt. Wir haben die Zeit erfun-den, um sie berechnen zu können. Während die Kohärenz-Kuratoren händeringend versuchen, die eingestürzte Brücke über die Sicherheit der Mathematik als Vibrationen des Rostes und Verschleiß der Realität in Formeln zu pressen. Doch der Vorhang hinter dem Papier zeigt uns keine Wellen, sondern durchsichtige Gefälle der Operatoren. Dort gibt es keine Zeit, keine Kausalität. Nur die totale Information. Dieser Prolog ist das letzte Zugeständnis an die mangelhafte Syntax unseres Geistes. Er ist die Krücke, die wir wegwerfen, sobald wir be-greifen, dass wir nicht fallen können, weil es in der absoluten Statik des Seins keine Richtung gibt, in die ein Sturz möglich wäre. Willkommen in der Architektur der logischen Beständig-keit. Die Brücke ist weg. Ich gehe trotzdem weiter. F.G. Stier" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
