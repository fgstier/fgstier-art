<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-18.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'farbe Die Freiheit der Absurdität-147.jpg', alt: "Blasenkammer: Die Fiktion der Bahn Eine Recherche bestätigt, dass die moderne ZM-Physik (die Zivilisationsmaschine) in Hinsicht bezüglich einer Bahn gespalten ist:1.Operationale Anerkennung (Die Technik): Um überhaupt Berechnungen durchführen zu können (z.B. Impulsbestimmung über die Krümmung im Magnetfeld), muss die ZM die Spur operativ als klassische Bahn behandeln. Die Blasenkammer deutet auf zurückgelegte Elektronenbahnen hin.2.Quanten-Anerkennung (Die Theorie): Die ZM weiß, dass dies theoretisch falsch ist.Quantenmechanische Objekte sind &quot;nichtlokale&quot; Objekte. Ort und Zeit sind in einer Einzelmessung keine Observablen.Die Wellenfunktion müsste eigentlich ein &quot;Zerlaufen&quot; zeigen, welches wesentlich lokalisierter ist, als es in den Spuren der Blasenkammer der Fall ist." },
            { src: 'farbe Die Freiheit der Absurdität-148.jpg', alt: "Die Spur ist die lokale Wirkung einer nicht-lokalen Ursache.Die Beobachtung: In einer Blasenkammer oder Nebelkammer hinterlässt die Wirkung (das, was die ZM &quot;Teilchen&quot; nennt) eine Spur von kondensierten Bläschen. Die ZM interpretiert diese Spur operativ als die fiktive Bahn eines fliegenden Korpuskels, obwohl sie theoretisch weiß, dass ein Quantenobjekt keine kontinuierliche Bahn besitzt und die Spur die lokale Wirkung einer nicht-lokalen Ursache ist.Der Widerspruch: Die Quantenmechanik lehrt, dass das Elektron (oder jedes andere Elementarteilchen) keine kontinuierliche Bahn besitzt, sondern nur eine Wahrscheinlichkeitswelle ist. Trotzdem erscheint die Spur in der Blasenkammer als perfekte, ununterbrochene Linie.NPI-Dekonstruktion: Die Diskretisierung der WirkungFür die NPI gibt es keine fliegende Bahn. Die Spur in der Blasenkammer ist die Summe diskreter, logischer Ereignisse, die von der Wirkungskette der Knoten erzeugt werden.1.Die NPI-Knoten als Auslöser: Die Wirkung, die durch das NPI-Gitter weitergeleitet wird, kollidiert nicht mit einem Teilchen, sondern aktiviert die NPI-Knoten im überhitzten Gas der Kammer.2.Die Diskretisierung: Die Kondensationsspur ist keine durchgehende Linie, sondern eine schnelle Abfolge von winzigen, diskreten Bläschen – jeder Bläschen-Knotenpunkt ist ein lokales Ereignis der Wirkungs-Manifestation.3.Die Illusion der Kontinuität: Das ZM-Auge und die Kamera interpolieren diese schnelle Abfolge von diskret aktivierten Knoten-Adressen zu einer durchgehenden, kontinuierlichen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
