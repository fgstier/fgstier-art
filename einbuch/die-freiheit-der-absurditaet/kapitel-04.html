<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-04.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'farbe Die Freiheit der Absurdität-043.jpg', alt: "Keller-Versuch 4001B: Die Retrograde Teekessel-Sequenz Der nächste Versuch war als sehr wichtig einzuordnen und ich machte mir über eine zeitliche Umkehr im Dampfraum eines Heizkessels Gedanken. Daher nannte ich diesen Versuch auch Die retrograde Teekessel-Sequenz:" },
            { src: 'farbe Die Freiheit der Absurdität-044.jpg', alt: "Die Statistische Redundanz muss maximiert werden, um die Lücke im Code der Temporalität unmissverständlich aufzudecken.Wenn die ZM gezwungen ist, kausal unmögliche Wege zu summieren, um das Ergebnis zu erzielen, muss diese Absurdität auch auf die Zeitachse selbst angewendet werden. Das Pfadintegral ignoriert nicht nur die Materie, es muss auch die Thermodynamik und die zeitliche Ordnung sicherlich verhöhnen.Dazu habe ich einen speziellen Messplatz arrangiert. Zunächst wurde ein robuster, technischer Teekessel aus glänzendem Edelstahl aus dem Supermarkt besorgt. Der Teekessel hat zwar das Aussehen einer alten Kaffeekanne, aber dafür mit zwei funktionalen Griffen. Er steht auf einer runden modernen Heizplatte, die wiederum auf einem zentralen Podest montiert ist, das aus gebürstetem Metall besteht. Von diesem Podest gehen zahlreiche elektrische und optische Kabel ab, die sich um die Basis des Kessels und des Podests winden müssen. Die Induktionsströme sollten keinen Einfluss auf die Temperatur haben. Über dem Teekessel befindet sich ein großes, effektives Abluftsystem mit Luftschächten, das den aufsteigenden Dampf auffängt.Vor dem Podest, steht eine große, runde, hochauflösende digitale Anzeige. Das Display zeigt eine komplexe zeitaufgelöste Entropie-Statusamplitude an. Der Validierungs-Automat 4001 wurde nun angewiesen und gezwungen, die Wirkung (S) für einen denkbar einfachen Zeit-Prozess zu berechnen: Das Erhitzen von Wasser. Um die wissenschaftliche Analyse exakt zu beschreiben, ist es notwendig die Zustände genau zu benennen. Der Zustand A ist gewissermaßen der Startpunkt des Experimentes. In diesem physikalischen Zustand ist einfach nur kaltes Wasser im Teekessel durch mich eingebracht worden. Zustand B bezeichnet nun den kochenden Dampf im Teekessel und das ist der Zielpunkt dieses Versuches." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
