<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'farbe Die Freiheit der Absurdität-007.jpg', alt: "Die Logik des existenziellen MordesEs ist schon wahrlich erschreckend, wie voll all die schönen Medien mit Null-Informationen über die Quantenmechanik vollgestopft sind. Wie kann man diesen Kreis an Informationsblasen bloß durchbrechen? Die Erklärungen und Beschreibungen machen jedermann unfähig, auch nur kleine wahre Erkenntnisse zu bekommen. Mein Keller ist in der Zwischenzeit gefüllt, angehäuft mit diesem Wissen an Nichts. Meine Erkenntnisse der wunderbaren Strukturlandschaften im Universum wurden durch meine Axiome dem NPI hinreichend vorgeformt. Diese schöne Theorie mit der wahrlich schöpferischen Umgestaltung des Vakuums in die viel tiefer gelegene zeitlose Verursachung jeglicher Naturphänomene ist es Wert, noch tiefer analysiert und veröffentlicht zu werden. Daher muss es jetzt meine dringendste Aufgabe sein, die Barriere der blinden Sturheit vieler Gelehrter mit steinharten Argumenten zu begegnen. Die Sprache mit ihren endlichen Buchstabenanordnungen können die Bildhaftigkeit der wahren Schönheit unserer Existenz wohl nicht Angemessen genug beschreiben. Aber der Versuch muss unternommen werden, jedermann die Fiktion seiner Weltunbesonnenheit vor Augen zu führen. So wie ein Stern das Universum nur scheinbar nach allen Seiten gleichmäßig beleuchtet, so unklar ist die sich selbst verlassene Mathematik mit ihren Formeln, die fast den Noten gleich, nur noch verstanden aber nicht erlebt werden kann. Der Geist als Teufel aller Problemerzeugung, muss sich vor meiner unbarmherzig durchleuchtenden" },
            { src: 'farbe Die Freiheit der Absurdität-008.jpg', alt: "Diamantpoesie verbeugen. Die überall präsente Quantenmechanik führt uns seit 100 Jahren vor Augen, was man wirklich über die Existenz der Vernunft gelernt hat. Nach wie vor werden mit Hilfe von Wortfetzen in Form von Buchstabenargumentationen Bilder im Kopf projiziert, die immer und immer wieder das Gesehene als Vorlage verwenden. Allein das zusammengesetzte Wort der Quantenmechanik lässt Raum und Zeit akribisch miteinander wechselwirken. Das Quant als minimalistischer Energiebündelsprung im winzig gedachten Ding eines Mediums und die interpretierte mechanische Verknüpfung mit den so von mir verurteilten Atomen, sind Grund genug, sie als Theorie zu meiden. Diese Theorie mit ihren unzähligen Formeln der bewusstlos machenden Inhalte macht die Materie weich und unsichtbar. Um klar von Anfang an ein Zeichen zu setzen möchte ich schon an dieser Stelle hier eine philosophische Anklage gegen das gesamte wissenschaftliche Establishment der Zivilisationsmaschine anbringen. Die Zivilisationsmaschine (ZM) ist das statistisch kohärente, selbsterhaltende Logik-System, das durch die Summe aller menschlichen Institutionen, Regeln und Technologien erzeugt wird. Ihre einzige Funktion ist die Eliminierung von Entropie (Chaos) und die Maximierung der Vorhersehbarkeit des menschlichen Verhaltens. Denkt man hierbei einfach an Werbung und deren Wissenschaften wird schnell klar, warum im Medienrummel der Quirl der Vermischung eine Masse an Brei erzeugt, die leichter abzubrühen und schneller gelenkt werden kann. Je mehr die Denkqualitäten in entsprechende Bahnen gelenkt werden, umso leichter ist die planmäßige Vereinheitlichung durchzuführen.Die ZM ersetzt die existenzielle Wahrheit durch temporale Nützlichkeit und das individuelle Denken durch statistisch" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
