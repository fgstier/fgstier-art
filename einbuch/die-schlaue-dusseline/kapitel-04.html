                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'die schlaue dusseline_148x210cm-086.jpg', alt: "ErwinDie Gastlichkeit war für eine Kneipe besonders groß. Links ging ein Gang von etwa 10 mal 3 Meter und rechts etwas mehr als 5 mal 3 Meter entlang. Die Theke ging direkt um die Ecke. Doppelfenster waren an den Außenwänden entlang angeordnet. Man konnte kaum hinaus schauen, weil die Glasscheiben fast undurchdringlich zuge-hängt waren mit Schiffen, Netzen, Muscheln, alten Bildern, Krabben, Zähnen und dergleichen mehr. Es wurde ausgiebig geraucht. An der Theke saßen vier Männer mit Bier vor sich. Zwei teilten sich jeweils einen Aschenbecher, die fast überlie-fen. Es roch stark nach Zigarettenasche und Zigarre. Die Leute bemusterten uns" },
            { src: 'die schlaue dusseline_148x210cm-087.jpg', alt: "beim Eintreten. Fremdlinge sind sehr selten hier anzutreffen, vermutete ich. Wir setzten uns an einen leeren Tisch ganz au-ßen. Neben uns stand eine uralte Musikbox mit Schallplatten. Da kam etwas Musik heraus. Soweit zu lesen war, kostete das Abspielen einer Platte 20 Cent. Die Lautstärke war einigerma-ßen erträglich. Zum Klo ging es die Treppe runter etwas rechts von mir neben der Musikbox. Die Wendeltreppe war dauerhaft beleuchtet. Die Wände waren beschmiert mit Kritzeleien, au-ßerdem beklebt mit Aufklebern. Der Tisch war etwas schmud-delig, und hatte in der Oberfläche lauter Riefen. Das Holz hatte kleine Löcher, bestimmt mit Holzwürmern durchsetzt. Ich hatte auch noch Zeit, mich genau darüber zu informieren, wie die Leute aus den Gläsern tranken und vor allem auch, wie sie mit dem großen Bierhumpen anstießen. Ohne das zu üben, würde ich mich bestimmt etwas ungeschickt anstellen. Natür-lich konnte mein Körper nichts trinken. Die Flüssigkeit wird in einen Trinksack gesammelt, der bei mir im Inneren versteckt war. Es gab noch eine ganze Menge anderer eingebauter kurio-ser Simulationen, um nicht gleich als unechte Type erkannt zu werden.Das Bier kam sehr schnell, obwohl niemand etwas bestellt hatte. „zum Wohl“ sprach die Wirtin. Sie war recht stramm ge-baut, mit weiten Hosen, plus Klapperlatschen an den Füßen. Sie war sicher hier zu Hause. „Auf die versteckten Musikpro-duzenten, und sie, nennen Sie mich Erwin“ erhob er sein Glas und klapperte an meinem Glas entlang. Der Schaum im Bier war gerade so bemessen, dass wenn er sich verflüssigt hat, das Bier gerade bis zum Eichstrich reichen würde. Mein Bier lande-te prompt auf dem Tisch. Der Wirt war aber auch gleich zur Stelle und wischte alles wieder sauber. Bei seinem Trinkspruch war ich etwas verlegen. Hatte er was bemerkt? Wieso erwähnte er das Wort Musikproduzent?" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
