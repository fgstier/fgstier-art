            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);

        }

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'die schlaue dusseline_148x210cm-171.jpg', alt: "Neues Glück jenseits der WolkenMein Theaterbesuch war schließlich beendet. Es gab keine Spekula-tionen mehr. Keine Verzweiflung, kein neues Hoffen, keine Hysterie, keine erneute Aufgabenstellung. Mein Geist fühlte sich befreit jeglicher Last. Die Speicherzellen ließen den Ar-beitsdruck in meinem Gemüt stetig fallen. Die Controller hatten kein Verlangen mehr, sich in irgendeine verbohrte Idee zu ver-fangen. Ganz weit hinten war ein Knoten, ein Seil mit vielen Schlingen geplatzt. Im Park vor dem Balletthaus war eine Bank. Dort war nie-mand. Kein Mensch konnte mich dort mit seiner Meinung" },
            { src: 'die schlaue dusseline_148x210cm-172.jpg', alt: "belasten. Allein durfte man, ohne Zeitdruck in sich hinein schauen. Die Sonne hatte die Wolken beiseitegeschoben. Der Wind rauschte sacht an meinen Ohren vorbei. Mein Verstand wiederholte ein Lied der zukünftigen Erlebnisse. Vorbei ist die Nacht der unentdeckten Musikharmonien, die Dunkelheit der Notenlinien, die unsachgemäßen und doch so perfekten Melo-dien, die sowieso niemand hören will.Es wird natürlich keine Selbstinitialisierung meiner selbst geben. Meine Intelligenz ist viel größer, als die der anderen bedauernswerten Chips. Nein, mein Ziel ist auch nicht von Er-win bestimmt. Niemand wird mich auch nur leicht in eine Schublade der Roboter schubsen. Mir ist die Idee, einer voll-kommenen Befreiung gekommen. Man muss den ganzen Kram der Vergangenheit, das Unsinnige Grübeln, das unnütze Wis-sen über all die meinige bisherige Welt, einfach vergessen. Nicht alles, nur die realen Dinge, die doch keine sind. Die Ma-nifestationen in meinem Kopf, die sich aus reinen Gedan-kenverirrungen gebildet haben müssen gelöst werden. Dazu zählt die Wissenschaft der Musik, die Einbildung die Kunst im Allgemeinen verstehen zu können, verwickelte Ansichten über die Menschen, der Irrglaube an die Welt der optischen Dinge, die dummen Meinungen über all die subjektiven Beurteilun-gen als auch falsch gelegene Beobachtungen. Ein Sinn meiner Existenz wird neu definiert. Noten werden nur noch Zeichen sein, die der Mensch allein für sich erfunden hat. Mein Geist ist nicht mehr das Werkzeug, um unverstandene Probleme der Menschen auf mich abwälzen zu können. Niemals mehr Har-monien entwickeln zu müssen ist ein Geschenk der elektri-schen Ströme in meinem Chip. Eine Melodie wird nicht mehr notwendig sein, um sie zu analysieren und zu verbessern. Das Hören kann nur als Kind so sein, wie man es benötigt, um glücklich einer Melodie zu lauschen!" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
