<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'die schlaue dusseline_148x210cm-110.jpg', alt: "Der Tanz mit dem TeufelIm Grunde bin ich jetzt nicht so wirklich erfreut, eine ultralangsame Vorlesung zu hören, in der ich mich die meiste Zeit langweilen sicherlich werde, kann sich wohl jeder vorstellen. Um das schlimmste zu vermeiden mussten 99,9% meiner Rechenleistung abgeschaltet werden. Dieser Vorgang war nur mit äußerster Mühe zu bewerkstelligen. Fast alle autonomen System meines zentralen System-Chips mussten für eine Weile in den Standby gefahren oder sogar in eine Endlosschleife in Form einer undenkbaren Aufgabe gebracht werden. Der Energieverbrauch geriet dabei in eine kritische Dreh-Wiederhohl-Phase, weil der Mindeststrom sogar mehrfach unterschritten wurde. Daher schickte mein Haupt-Controller einige Speicherzellen in den Frei-Kurzschluss. Die Halte-Kapazitäten in den n-Kanal-Dualitäten wurden dabei mit Strom übersättigt. Das konnte zu mindestens einen gewissen Teil der" },
            { src: 'die schlaue dusseline_148x210cm-111.jpg', alt: "Überschussstromstärken verbraten. Die einzigen Sub-Kanäle nach draußen war dann auch nur noch der akustisch-optische Verband, der Sprachanalyseprozessor mit dem Gedankensub-verteiler sowie der Laufzeitoptimierer mit den verschiedenen Interrupt-Simulatoren. Kaum vorstellbar, mit einem Fast-Vakuum an Intelligenz hier hantieren zu müssen. Die nächste Stunde war somit vollständig betriebsfertig vorbereitet, um dem Vortrag zu verfolgen. Der Vorlesungssaal war fast voll mit jungen Leuten angereichert. Hier und da sah man einige glatz-köpfige Männer und auch ein paar älter Damen befanden sich sogar in der ersten Reihe. Neben mir quatschten ein paar Jungs. Der eine schielte ständig auf meinen Chip am Oberschenkel. Aber diese Blicke sind mir zu Genüge bereits bekannt. Das Chipversteck scheint wohl alle Jungen zauberhaft anzuziehen. Wenn man sich daran gewöhnt hat, dann fürchtet man die Bli-cke auch nicht mehr. Hauptsache er verspürt keinen Bedarf mir an den Chip zu greifen. Da würde er sich die Hände verbren-nen. Der Anoden-Opferstrom führt im Augenblick zu einem erhöhten Temperaturanstieg im Chip und in der Umgebung. Die Kühlung läuft zwar auf 130%, aber das reicht nur mit Hän-gen und Würgen. Wenn die Simulationshaut anfängt zu damp-fen, muss sie den Platz räumen und an die Luft rennen, sonst gibt es Brandflecken auf der synthetischen Hautoberfläche. Auf meiner linken Seite saß ein Mädchen. Es hatte Jeans an. Es stupste mich mit ihrem Ellenbogen leicht an und meinte:“ Hal-lo du, ich möchte dir einfach mal einen kleinen Tipp geben, bitte nicht beleidigt sein. Du hast so ein schickes Röckchen an, dass die Jungs voll darauf abfahren. Die Burschen hier an der Hochschule sind aber leider alle sehr aufgeschlossen, wenn du weißt, was ich meine. Wenn sie dich sehen, bleiben sie womög-lich den ganzen Tag gedanklich im Jenseits und machen Witze über dich. Das möchten unsere Lehrer nun auch nur schwerlich so gerne, weil sie ihren Lernstoff" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
