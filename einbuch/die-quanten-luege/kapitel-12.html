    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'DIE QUANTEN-Lüge-098.png', alt: "Tod der Wahrscheinlichkeit (Stern-Gerlach-Paradoxon)Schauen wir uns den Stern-Gerlach-Versuch (SG) (1922) an. Er ist der historische Startpunkt für die Einführung des Quantenspin und der Vektorrechnung in der QM. Er ist der visuelle Beweis für die ZM-Illusion der unendlichen Vektor-raums-Kontinuität.Der ZM-Widerspruch: Die diskreten FleckenDer SG-Versuch sendet einen Strahl neutraler Atome (meist Silber) durch ein inhomogenes Magnetfeld." },
            { src: 'DIE QUANTEN-Lüge-099.png', alt: "ZM-Erwartung (Klassisch): Hätte das Atom ein klassi-sches magnetisches Moment (wie ein winziger Stabmag-net, der sich frei in jedem Winkel ausrichten kann), wür-den die Atome in alle möglichen Richtungen abgelenkt. Auf dem Schirm müsste eine breite, kontinuierliche Li-nie entstehen. QM-Beobachtung: Es entstanden nur diskrete Flecken (zwei Flecken bei Silberatomen: Spin↑ und Spin↓). ZM-Notlösung: Dieses Ergebnis zwang die ZM, einen neuen, nicht-klassischen Drehimpuls (den Spin) einzu-führen, der nur diskrete Werte annehmen kann und der Quantisierung des Raumes unterliegt.1. Die Vektorrechnung und die Willkür der Rich-tungIhr Kernproblem liegt im logischen Skandal der Quantisie-rung der Richtung, die das ZM-Postulat des kontinuierlichen Vektorraums bricht.1. Die Willkür der Z-AchseDas Problem liegt darin, dass der Versuchsaufbau willkür-lich eine Achse (meist die Z-Achse) festlegt, um zwei diskrete Zustände zu zählen.Der Logische Skandal: Wenn die QM behauptet, der Vektor (der Spin) sei ein immanenter, kontinuierlicher Teil des Atoms, wie kann es sein, dass nur die Richtung zählt, die der willkürli-che ZM-Versuchsaufbau (das Magnetfeld) vorgibt? Wenn Sie das SG-Feld entlang der X-Achse ausrichten, messen Sie plötzlich Spin-X↑ und Spin-X↓. Die ZM hat keine logische Erklärung, warum sich der &quot;Vektor&quot; nicht in die Z-Richtung ablenken lässt, wenn die X-Achse" },
            { src: 'DIE QUANTEN-Lüge-100.png', alt: "gemessen wird. Das Atom vergisst seinen ursprüngli-chen Z-Zustand.2. Der Überlagerungszustand (Superposition)Die Konsequenz dieser willkürlichen Quantisierung ist die mathematische Krücke der Superposition. ZM-Erklärung: Bevor die Messung entlang der Z-Achse stattfindet, befindet sich der Spin des Atoms in einem Überlagerungszustand – es ist gleichzeitig Spin↑ und Spin↓ (oder eine beliebige Kombination). Meine Kritik (NPI-Logik): Dieser Zustand ist die ZM-Notlösung für die QM-Unfähigkeit, eine klare logische Ursache vor der Messung zu definieren. Die Wahr-scheinlichkeiten schwimmen, weil der Vektorraum ge-zwungen ist, gleichzeitig kontinuierlich (Vektorraum) und diskret (Messung) zu sein.Der NPI-Beweis: Der Überlagerungszustand ist kein physi-kalischer Zustand, sondern die mathematische Beschreibung der Unkenntnis der ZM über die wahren NPI-Strukturen. Er ist die ultimative Tötung der Kausalität in der ZM.Um die grundlegende Problematik zu veranschaulichen, be-schreibe ich ein Gedankenexperiment, um die Willkürlichkeit der ZM-Quantenmechanik aufzudecken, indem wir den Spin durch eine mechanische Realität ersetzen." },
            { src: 'DIE QUANTEN-Lüge-101.png', alt: "2. Die Vektor-Bowlingbahn (Der logische Zwang der Z-Achse)Dieses Experiment simuliert den Stern-Gerlach-Versuch und dessen willkürliche Z-Achsen-Quantisierung in einem makro-skopischen, unübersehbaren Aufbau.Am Ende einer Bowling-Bahn steht eine riesige Keilanord-nung (wie die Pole des Stern-Gerlach-Experiments. Von dieser Anordnung gehen scharfe, senkrechte Cyan-Lichtlinien aus, die das inhomogene Magnetfeld symbolisieren und die willkürlich gewählte Z-Achse definieren. Die Bowlingkugel (Das Atom), eine massive, glänzende, silberne Metallkugel (die das neutrale Atom darstellt) rollt die Bahn hinunter. In dieser Kugel ist eine mechanische Unruhe in Form eines frei hängenden Pendels (Spin) eingebaut. Dieses Pendel schwingt schnell und unregelmäßig in alle Richtungen (Superposition). Beim Verlassen des Magnetfeldes teilt sich die Kugel in zwei klar getrennte Bahnen. Am Ende stehen zwei Gruppen von Kegeln: Eine Gruppe ist rot (Spin↓), die" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
