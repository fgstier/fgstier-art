<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sektor-Archiv // F.G. Stier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        
        /* Scanline Effekt */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

        #bg-slot { z-index: -1; }

        /* Cyber Glow Rahmen für das Dokument */
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }

        /* Übergangs-Effekt (Scan-Wipe über Clip-Path) */
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>

    <!-- 1. HINTERGRUND: RADAR SCANNER -->
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>

    <!-- 2. HAUPTINHALT: SEITEN-CONTAINER (STATISCH + SKRIPT-ÜBERGANG) -->
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 3</span>
        </div>

        <!-- Buchseiten-Container im exakten Seitenverhältnis (15.5 / 22.8) -->
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="Sektor-Archiv Seite" class="w-full h-full object-cover rounded-lg">
        </div>
        
        <!-- Terminal-Steuerung: Vor & Zurück -->
        <div class="mt-6 flex gap-4">
            <button onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">
                // ZURÜCK
            </button>
            <button onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">
                // WEITER
            </button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">
                // ZURÜCK ZUM INHALT
            </a>
        </div>	
		
		
		


    </div>

    <!-- RADAR SCRIPT (Hintergrund) -->
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f"; 
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>

    <!-- SEITEN-STEUERUNGS-SCRIPT MIT TRANSITION -->
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        
        // Deine 3 Bilddateien für die jeweiligen Seiten
        const pageFiles = ['DIE QUANTEN-Lüge-135.png', 'DIE QUANTEN-Lüge-136.png', 'DIE QUANTEN-Lüge-137.png'];
        let currentIndex = 0;

        // Initialisierung beim Laden der Seite sicherstellen
        pageImage.src = pageFiles[0];
        indicator.innerText = `// Seite 1 VON ${pageFiles.length}`;

        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            
            // Begrenzung auf die vorhandenen Seiten
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            
            currentIndex = newIndex;

            // 1. Übergang starten
            pageImage.classList.add('transition-wipe');

            // 2. Nach der Hälfte der Animation das Bild austauschen
            setTimeout(() => {
                pageImage.src = pageFiles[currentIndex];
                pageImage.classList.remove('transition-wipe');
            }, 400);

            // Anzeige oben aktualisieren
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
    </script>

</body>
</html>
