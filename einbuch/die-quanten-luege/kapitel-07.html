<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 4</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK</button>
            <button onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>

    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'DIE QUANTEN-Lüge-062.png', alt: "Unipolar-Paradoxon: Dreht sich das Feld mit? Die Frage, ob das Magnetfeld eines rotierenden Per-manentmagneten sich mit dreht oder nicht, führt die Zivilisati-onsmaschine (ZM) in ein unlösbares logisches Dilemma.Dieses Problem wird in der Physik als Unipolar-Paradoxon oder Faraday-Generator-Paradoxon bezeichnet.Der ZM-Zwangsmechanismus bricht an diesem Punkt zu-sammen, weil die ZM zwei diametral entgegengesetzte Defini-tionen des Magnetfeldes benötigt, um das Phänomen der In-duktion zu erklären." },
            { src: 'DIE QUANTEN-Lüge-063.png', alt: "Der Versuchsaufbau und die logische AnforderungMan betrachte den sogenannten Unipolar-Generator (Fara-day’sche Scheibe): Eine leitende Scheibe (die den Magneten selbst darstellen kann) dreht sich in einem Magnetfeld.Der Unipolar-Generator (auch bekannt als Homopolar-Generator oder Faraday’sche Scheibe) ist ein faszinierendes elektrotechnisches Phänomen und war das erste mechanische Prinzip zur Erzeugung eines kontinuierlichen Gleichstroms. Der Unipolar-Generator arbeitet nach einem sehr einfachen, aber speziellen Prinzip. Aufgrund dieser Eigenschaften wird der Unipolar-Generator heute in Nischenbereichen eingesetzt, die kurzzeitig sehr große Mengen an Strom benötigen, wie zum Beispiel bei elektromagnetischen Kanonen (Railgun) oder in bestimmten Schweißverfahren." },
            { src: 'DIE QUANTEN-Lüge-064.png', alt: "SzenarioZM-FrageZM-AntwortDer Magnet ro-tiert, die äußere Messschleife steht.Erzeugt der Magnet trotzdem eine Span-nung?Die EMK hängt von der relativen Bewe-gung zwischen Feld und Leiter ab. Ist das Feld am Ort des Leiters konstant, gibt es keine Span-nung.Das Feld dreht sich mit der Ma-terie.Die ZM-Lorentz-Kraft sagt: Wenn der Leiter (Scheibe) sich relativ zum Feld bewegt, wird eine EMK induziert. Wenn sich das Feld mit dem Leiter bewegt, gibt es keine relative Bewe-gung und keine EMK.Das Feld ist räumlich fixiert.Die ZM-Flussregel sagt: Wenn sich der Magnet dreht, sehen die festste-henden äußeren Feldli-nien keine Änderung (dΦ/dt=0) und es gäbe keine EMK." },
            { src: 'DIE QUANTEN-Lüge-065.png', alt: "Die ZM-Widersprüche(Das Paradoxon - Die ZM-Notlüge: Zwei Ursachen für eine Wirkung)Die ZM muss, um das Funktionieren des Unipolar-Generators zu erklären, zwischen zwei Versionen der Realität wechseln. Das Magnetfeld wird je nach Standpunkt des ZM-Beobachters neu definiert:1.Die N-Theorie (Stationäres Feld / Lorentzkraft)Die sogenannte N-Theorie besagt, dass das Magnetfeld bei einem rotierenden Magneten stationär bleibt. Die Elektronen im Magneten und in der rotierenden Scheibe rotieren durch dieses stationäre Magnetfeld und werden aufgrund der Lor-entzkraft entweder zum Rand oder zur Achse des Magneten bzw. der Scheibe hin beschleunigt. Der Ursprung der Induktion liegt somit im Magneten oder in der Scheibe selbst. (NPI-Kommentar: Die ZM muss hier das Feld von der Materie trennen.)2.Die M-Theorie (Mitrotierendes Feld / Fluss-Schnitt)Die sogenannte M-Theorie besagt, dass das Magnetfeld mit dem Magneten mitrotiert. Die induzierte Spannung bewirkt, dass die magnetischen Feldlinien – auch Kraftlinien genannt – die Leiterteile des externen Stromkreises schneiden. Der Ur-sprung der Induktion liegt in diesem Fall im externen Strom-kreis und der zeitlichen Änderung des Flusses (dΦ/dt)." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
