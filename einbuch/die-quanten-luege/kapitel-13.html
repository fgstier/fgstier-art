    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'DIE QUANTEN-Lüge-105.png', alt: "Kaskaden-Illusion: Der Tod der SuperpositionEine Kaskade besteht bei diesem Versuch aus mindes-tens zwei identische SG-Anordnungen, die entweder gleich ausgerichtet sind oder um jeweils 90 Grad gedreht sind. Das Grundproblem ist ganz einfach. Wenn man annimmt, dass die Pendel in den Kugeln nach einer Trennung weiterhin ihre Pen-delschwingung ausüben, dann sind sie eben zufällig irgendwo erwischt worden, um sich in die eine oder andere Richtung zu bewegen. Die Kraft vom Magneten hat die Kugel nur temporär abgelenkt. Warum nun nur in zwei Punkten?Der Logik-Fehler:Die ZM nennt dies &quot;Quantelung des Spins&quot;. Sie beschreibt das diskrete Verhalten, aber sie erklärt nicht die Ursache, wa-rum das Atom die unendlich vielen Zwischenwerte des Vek-torraums ignoriert. Es ist ein mathematisches Postulat, das der Beobachtung folgt, nicht aber ein logisches Axiom." },
            { src: 'DIE QUANTEN-Lüge-106.png', alt: "Kurz gesagt: Die ZM argumentiert, dass die Ströme nur Up oder Down sind, weil die Regeln des Universums es vorschrei-ben – sie kann aber nicht erklären, warum die Regeln so und nicht kontinuierlich sind.Das war nur das erste Problem. Mit diesem mathematischen Postulat handelt man sich gleich das nächste Problem ein. Wenn die Kugeln zufällig getrennt worden sind, warum sollten sie bei der gleichen Anordnung genauso bleiben? Wenn man die Apparaturen dreht zerfallen die Richtungen ja auch wieder in zwei Punkte?Das ist der zentrale, logische Zusammenbruch der ZM-Quantenmechanik (QM), der den Stern-Gerlach-Versuch so un-begreiflich macht. Dieses Unverständnis ist der unwiderlegbare Beweis für die Inkonsistenz der ZM-Logik.Ich kläre dieses Grundproblem in zwei Schritten, indem ich die ZM-Behauptung der Speicherfähigkeit des Spins widerle-gen und dann die NPI-Lösung der Strukturellen Notwendig-keit präsentieren.Es gibt keinen logischen Grund, warum die Kugel nach der ersten Messung &quot;nur noch blau&quot; (oder Spinup) sein sollte. Das ist das ZM-Postulat der Messung (der Kollaps der Wellenfunkti-on), das dem gesunden Menschenverstand widerspricht.1. Das &quot;Vergessen&quot; des Vektors ZM-Annahme der Kontinuität: Nach ZM-Vektorlogik müsste der Spin-Vektor im Inneren der Kugel (die me-chanische Unruhe) weiterhin in alle Richtungen schwin-gen. Der Magnet hat ihn nur temporär abgelenkt. Es gibt keinen physikalischen Mechanismus, der dem Pendel" },
            { src: 'DIE QUANTEN-Lüge-107.png', alt: "vorschreibt, sich nach der Ablenkung nur noch entlang der Z-Achse auszurichten. Der logische Zwang: Wenn die &quot;blaue&quot; Kugel in ein um 90 Grad gedrehtes Feld (X-Achse) geschickt wird, muss die QM sie wieder in zwei Flecken (XUp und XDown) auf-teilen, weil die Kugel ihren ursprünglichen Z-Zustand (die &quot;Blaue Farbe&quot;) vergessen hat. Dies zeigt die Willkür der QM-Messung: Sie erfasst keine gespeicherte Eigen-schaft, sondern nur die momentane Reaktion auf das Feld.2. Das &quot;Nicht-Vergessen&quot; (Der entscheidende Widerspruch)Genau an dieser Stelle bricht die ZM-Logik endgültig zu-sammen und erzeugt das Paradoxon, das so verwirrt:Der ZM-Widerspruch:Wenn man die &quot;blaue&quot; Kugel nimmt und sie ein zweites Mal durch das GLEICHE Z-Feld schicken, teilt sie sich NICHT wieder in zwei Flecken. Sie bleibt zu 100% BLAU!Die Absurdität:Die QM postuliert, dass das erste Messen den Zustand &quot;rein&quot; gemacht hat (Kollaps der Wellenfunktion). Das Atom hat plötzlich gelernt, nur noch Spin↓ zu sein, obwohl der Spin-Vektor kontinuierlich sein müsste.Schlussfolgerung: Das Atom vergisst seinen Zustand, wenn man die Achse wechselt (Z X), aber es speichert seinen Zu-stand, wenn Sie die Achse beibehalten (Z Z). Der Spin ist damit kein physikalischer Vektor, sondern eine logische Vari-able, die nur während der Messung existiert und willkürlich auf die Messachse reagiert." },
            { src: 'DIE QUANTEN-Lüge-108.png', alt: "NPI-Lösung: Der Spin als Logisches PrädikatDie NPI-Logik eliminiert dieses widersprüchliche Verhalten durch die Tötung der Superposition und des Speichergedan-kens:3. Der Spin ist kein Speicher, sondern eine EntscheidungDer Spin ist keine immanente Eigenschaft der Kugel, die ge-speichert wird (wie eine Farbe oder eine Masse). Der Spin ist ein logisches Prädikat, das erst durch das inhomogene Magnet-feld (die Keile) aktiviert wird. Das Feld als logische Frage: Das ZM-Magnetfeld (die Keile) stellt die Frage: &quot;Bist du im stabilen Zustand +Z oder -Z?&quot; Die Materie als Antwort-Zwangsmechanismus: Die Ma-terie (die Kugel) kann nur mit einer von zwei diskreten Antworten reagieren, da nur diese Zustände logisch ko-härent mit der NPI-Struktur des Feldes sind.4. Die Strukturelle Notwendigkeit (NPI-Lösung) Der Fall Z Z (Speicherung): Beim zweiten Durchlauf durch das gleiche Z-Feld bleibt die Kugel zu 100% blau, weil die logische Frage und die strukturelle Antwort-Notwendigkeit unverändert sind. Das System ist bereits im stabilsten logischen Zustand zur Achse. Die ZM sieht dies als &quot;Speicherung&quot;, aber es ist in Wahrheit die kon-stante NPI-Struktur. Der Fall Z X (Vergessen/Teilung): Beim Durchlauf durch das X-Feld wird eine neue, andere logische Frage gestellt. Die Kugel reagiert instantan auf die neue struk-turelle Notwendigkeit der X-Achse und muss erneut ei-ne" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
