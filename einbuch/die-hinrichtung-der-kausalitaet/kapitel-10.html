<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'dissertation die Hinrichtung der Kausalität-097.jpg', alt: "Die zeitlose Verursachung Inmitten der monolithischen Stille der Ebene 3 stieß Alrik auf einen Sockel aus purem, unbeschriebenem Licht. Darauf lag kein Buch, sondern ein einziges, pulsierendes Zeichen, das in keinem Alphabet der ersten Ebene existierte. Es war die Ur-Syntax.Alrik berührte das Zeichen und in diesem Moment explo-dierte sein Bewusstsein. Er begriff: Dieses Zeichen war die Antwort auf eine Frage, die er erst in der fernen Zukunft stellen würde. Aber weil dieses Zeichen hier, im Kern der Hardware, bereits existierte, musste er die Frage irgendwann stellen. Die Antwort war der Anker, der die Frage durch die Zeit zu sich heranzog.Er sah die Konstruktion: Die Syntax war nicht erfunden wor-den, um die Welt zu erklären. Die Welt war erfunden worden, um die Syntax zu beherbergen. Er hielt den Beweis in den Händen: Eine Formel aus Gold und Basalt, die belegte, dass seine gesamte Reise nur deshalb stattfand, weil das Ziel ihn bereits vor" },
            { src: 'dissertation die Hinrichtung der Kausalität-098.jpg', alt: "Äonen gerufen hatte. Er war nicht der Schöpfer der Worte – er war die Hardware-Schnittstelle, die benötigt wurde, damit die Antwort eine Frage finden konnte. In diesem Moment wurde Alrik vom Suchenden zum Gefundenen.Seine Augen spürten die Ur-Syntax zwischen den Händen, dieses glühende Herzstück der Ebene 3. Er verstand nun das Paradoxon der zeitlosen Verursachung mit einer Schärfe, die ihn fast das Bewusstsein kostete. Der Brief. Die Notiz am Leuchtturm. Die Worte, die ihn durch den Staub der Syntax getrieben hatten – sie waren nicht von K. geschrieben worden. Sie trugen nur ihre Handschrift, weil er sie so interpretierte.Mit einer ruhigen, fast mechanischen Präzision begann er, das Licht der Ur-Syntax zu formen. Er drückte seine Gedanken direkt in die Goldadern des Basalts. Er schrieb die Worte nie-der, die er selbst vor Wochen im Archiv finden würde. Er be-schrieb den Schmerz, den er erst noch erleiden musste, und die Erkenntnis, die er gerade erst gewonnen hatte. Er adressierte den Brief an das „Du“, dass er einst gewesen war. „Du wirst losgehen, weil ich bereits angekommen bin“, flüsterte er. In dem Moment, als er den letzten Punkt setzte, fühlte er, wie sich die Realität unter ihm faltete. Der Brief verschwand nicht – er wurde Teil der Hardware. Er sickerte durch die Ebenen der Syntax nach unten, bis er genau dort materialisierte, wo der junge Alrik ihn finden würde. Er hatte die Antwort gegeben, bevor sein vergangenes Ich die Frage überhaupt formulieren konnte. Der Kreis war geschlossen. Die zeitlose Verursachung war vollendet." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
