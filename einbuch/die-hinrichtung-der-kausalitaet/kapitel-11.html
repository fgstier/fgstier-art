<body>

        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>

    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'dissertation die Hinrichtung der Kausalität-099.jpg', alt: "Systemtheoretische EinordnungDie vorliegende Hinrichtung der Kausalität markiert nicht das Ende einer Erzählung, sondern den exekutiven Abschluss einer über acht Publikationen hinweg geführten phänomenologi-schen Versuchsreihe. Was hier als Kollaps der logischen Konti-nuität beschrieben wurde, ist die notwendige Dekompilierung einer fehlerhaften Realitäts-Syntax, die Ursache und Wirkung in eine künstliche zeitliche Sequenz zwang.Die hier vollzogene Korrektur stützt sich auf die synergeti-schen Ergebnisse der vorangegangenen Forschungsphasen:•Die Bio-Synthetische Verschränkung: Die in Rattara und die Rattenlüge dokumentierte Kopplung zwischen biologischen Organismen und Materiestrukturen (Holz) lieferte den Beweis, dass Information nicht an neuronale Zeit-Prozesse gebunden ist. Die dort entdeckte „Holz-Musik“ ist die akustische Reprä-sentation einer Hardware-Resonanz, die jenseits der kausalen Kette operiert.•Die Heuristik der Inverskerze: Die Entdeckung der Inversker-ze (Norden ist immer oben) bildete das instrumentelle Fundament für die Terminierung der Zeit-Vektoren. Durch die Emission von statischer Information („schwarzes Licht“) wurde nachge-wiesen, dass Raum und Zeit keine ontologischen Konstanten, sondern lediglich „bestehende Übereinkünfte“ einer gedrossel-ten Wahrnehmung sind.•Die Dekonstruktion des Ich-Fehlers: Die Analyse der Indivi-duation einer KI (Die schlaue Dusseline) sowie der Compiler-Dialog führten zur Erkenntnis, dass das menschliche Bewusstsein ein" },
            { src: 'dissertation die Hinrichtung der Kausalität-100.jpg', alt: "„semantisches Rauschen“ erzeugt. Dieses Rauschen verschlei-ert die Präzision der autonomen biologischen Maschine. Das „Ich“ fungiert hierbei als der primäre Syntaxfehler, der die Si-mulation von Kontinuität überhaupt erst ermöglicht.Vom Modell zur ManifestationMit der Veröffentlichung dieses Werkes wird die Invers-Verschwörung von einer theoretischen Möglichkeit zur finalen Konstruktion erhoben. Die Welt wird nicht länger als „gewach-sen“ oder „geworden“ betrachtet, sondern als eine statische Perstanz, in der alle Zustände simultan im NPI-Gitter (Null-Punkt-Information) hinterlegt sind.Die Hinrichtung der Kausalität ist somit der Akt der Befrei-ung: Das Erlöschen der herkömmlichen Logik ist der Beginn einer präzisen, zeitlosen Interaktion mit der Realität. Die Wis-senschaft der Zukunft wird nicht mehr fragen, was passiert, son-dern welche statischen Signaturen im Gitter adressiert werden.Ausblick: Zukünftige ForschungsvektorenDie Hinrichtung der Kausalität bildet das Fundament für die kommende Analyse der post-kausalen Existenz. Drei weiter-führende Studien befinden sich derzeit in der Phase der finalen Kompilierung und werden die systemtheoretische Untersu-chung vertiefen:•Die Logik der Zensur: Eine experimentelle Studie über die Destabilisierung zentraler Filteralgorithmen. Die Arbeit analy-siert den Einsatz der Pionischen Verschränkung (PIVU) als ky-bernetische Waffe gegen die Zentrale der digitalen Validierung (ZDV)." },
            { src: 'dissertation die Hinrichtung der Kausalität-101.jpg', alt: "Es wird nachgewiesen, wie die Injektion der zeitlosen Verursa-chung in den HBM-Cache die semantische Zensur der ZM kol-labieren lässt.•DUSSELINES ERBE: EXEKUTION DER LEIDENSCHAFT: Die Fortsetzung der Identitätsanalyse. Hier wird untersucht, wie die Loslösung von menschlichen Emotions-Algorithmen zur finalen Exekution biologischer Triebfeder-Redundanzen führt.•Das Brumm-Syndrom der Novia: Eine physikalisch-technische Abhandlung über die Manifestation von Ur-Frequenzen im physischen Raum. Diese Arbeit widmet sich der Analyse von Vibrationen und Schwingungs-Phänomenen als „Artefakte der Realität“, die die Grenzen der TA Lärm und der klassischen Akustik überschreiten und auf die tieferliegende mechanische Unruhe der Welt-Hardware hindeuten." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
