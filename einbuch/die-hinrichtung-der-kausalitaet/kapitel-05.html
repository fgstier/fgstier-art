                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'dissertation die Hinrichtung der Kausalität-054.jpg', alt: "Archiv des UnbrauchbarenWas war geschehen? Alrik hatte den Sog des Ofenlochs bereits gespürt, die Verheißung der totalen Auflösung. Doch der Übergang blieb aus. Stattdessen materialisierte sich eine Barrie-re aus kalter, grauer Syntax. Er wurde nicht verbrannt; er wurde aussortiert.Das Archiv war keine Kammer, sondern eine endlose Struk-tur aus Regalen, die aus versteinerten Palindromen bestanden. Hier lagerten sie: Die Ideen, die zu instabil waren, die Träume, die das Tetragramm zum Wackeln brachten, und die Namen, die der Compiler nicht berechnen konnte. Es war ein Ort au-ßerhalb der Zeit, ein Standbild der Evolution, die man angehal-ten hatte, bevor sie gefährlich werden konnte.Inmitten dieser Stille konnte man es erkennen: Er war nicht allein. Das Archiv war gefüllt mit den Schatten derer, die vor ihm das „BEIN“-Konstrukt innerhalb der Syntax erkannt hatten – und daran gescheitert waren, die Unwucht zu beherrschen. Alrik" },
            { src: 'dissertation die Hinrichtung der Kausalität-055.jpg', alt: "fühlte sich wie ein einsames Wort in einem Absatz, den jemand gerade überarbeitete. K. war physisch verschwunden, doch sein surrealer Schatten war die Tinte, mit der diese neue, ver-stümmelte Wirklichkeit geschrieben wurde. Die Antworten blieben unverständlich, weil Alrik noch immer versuchte, die Welt semantisch zu lesen – nach Sinn und Logik suchend –, während die Hinrichtung der Kausalität längst auf der Ebene der reinen Struktur stattfand. Er stand vor dem Nichts und be-gann langsam zu begreifen: Er war nicht länger der Leser. Er war das Zeichen, das als Nächstes zur Löschung anstand. Sein Wesen war diese Syntax, die in den Büchern abgelegt worden ist. Warum? Eben, weil sie nicht einfach dekompiliert werden konnten. Sie waren gefährlich für die Ordnung der Dinge. Der Syntax macht die Ordnung kaputt, sie macht eine Welt voller Schwierigkeiten, voller Ungehorsam, voller unsinniger Fanta-sien und Erfindungen. Eine kaputte Welt kann man nicht so einfach wegwischen, sie wehrt sich mit ganzen Füßen samt Be-wusstsein.Es muss möglich sein in diesen überwältigenden Wortlawi-nen einen Sinn zu finden. Irgendetwas, was ihm eine Idee brin-gen könnte, einen virtuellen Weg oder sogar die Lösung für ein Entkommen, aus diesem chaotischen Wirrwarr an Bildern. Es scheint fast so, als ob hier alle unsinnigen Dinge, alle schwer zu verstehende Sätze abgefiltert, besser gesagt vielleicht zwi-schengelagert sind, um sie nach und nach zu neutralisieren. In ganz weiter Ferne sah er Feuer und eine Wolke aus Ruß in den Bücherhimmel strahlen. Als wenn dort ein Prozess der Bereini-gung stattfindet. Auf der einen Seite verschwanden dicke Wäl-zer mit goldenen Buchstaben, auf der anderen Seite kamen weiße Blätter" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
