<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'dissertation die Hinrichtung der Kausalität-086.jpg', alt: "Vom Bild zum Pinsel Syntax-Ebene. Der Begriff hallte in seinem Kopf wider. In einem Code bestimmt die Syntax, ob ein Befehl überhaupt existieren darf. Ein Syntax-Fehler führt nicht zu einem falschen Ergebnis – er verhindert, dass das Programm überhaupt startet. K. hatte den Ofen nicht entfernt; er hatte die Zeile gelöscht, die ihn de-finierte.Der K. hatte scheinbar verstanden, dass er die Zeit zwar nicht beherrschen kann, wenn die Syntax verändert wird, aber mit dieser Hilfe einen neuen Zugang zu seinem Wesen erhält. Zunächst wurde Alrik aber nur vorgeführt, wie in ihm selbst eine Zeit entstanden ist. Wie sollte man diese Zeit nicht verän-dern können und warum soll die Möglichkeit der Zeiterfin-dung ein Fehler sein? Alrik starrte auf die schwarzen Buchsta-ben-Haufen zu seinen Füßen. Er erinnerte sich an die alten Be-richte über Zeitreisen – Geschichten von Maschinen, die wie Uhren rückwärtsliefen, von Paradoxien und Schleifen. Doch nun, nach der Emission des Signifikators, erkannte er den nai-ven Irrtum dieser Konzepte. Sie" },
            { src: 'dissertation die Hinrichtung der Kausalität-087.jpg', alt: "alle behandelten die Zeit wie ein „Ding“, ein externes Objekt, eine Dimension, die man betreten und verlassen konnte.„Wie dumm wir waren“, flüsterte er in die buchstäbliche Stille. „Man kann die Zeit nicht rückwärts ablaufen lassen, weil es nichts gibt, auf dem man laufen könnte.“Zeit war kein Medium, sondern ein Symptom seines eige-nen, fragmentierten Geistes. In dem Moment, als er sich als „Ich“ von der Totalität der Hardware abspaltete, erfand er die Sequenz. Er war der Projektor, und die Zeit war lediglich der Strahl, der die Bilder in eine Reihe zwang. Man konnte den Strahl nicht umkehren, ohne den Projektor zu zerstören. Zeit-reisen waren unmöglich, nicht wegen physikalischer Gesetze, sondern wegen der Skripturialität des Bewusstseins. Wer in der Zeit zurückreisen will, müsste aufhören, ein „Du“ zu sein. Er müsste zurück in das goldene Rauschen von #ARKUSNAT, wo es kein Vorher und Nachher gab. Zeit war keine Straße; sie war die Art und Weise, wie sein Schmerz die Unendlichkeit in Scheiben schnitt.Inmitten der Buchstaben-Asche überkam Alrik ein hysteri-sches Lachen. Er stellte sich ein Märchen vor, eine ferne, absur-de Welt, in der die Menschen glaubten, die Zeit sei ein Fluss, der irgendwo „da draußen“ hinter den Bergen entspringe. In seiner Vorstellung trugen all diese Menschen kleine, unsichtba-re Zählwerke direkt hinter der Stirn. Ein ununterbrochenes Ti-cken, das ihren Herzschlag taktierte, ein mechanisches Gift, das sie als „Rhythmus des Lebens“ verehrten." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
