<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Loop Bug - Dusseline-148.jpg', alt: "Unterwegs zum BallettAm Bahnhof angekommen sollte es zusätzlich zu einem Zwischenfall kommen, der meine Denkzellen erneut in Zwietracht brachte. Wenn man bedenkt, welche Informationen bisher zu mir geleitet wurden, konnte man folgende Überlegungen anstellen. Entweder entsteht ein Problem mit meiner Musik durch die Weiterleitung in elektronischen Geräten, die eine Filterung der durchgetriebenen Melodien verursacht, oder aber die Umgebung der konsumierten Musik hat eine Bedeutung für die Menschen.Es könnte aber auch der reine Ort sein, der eine Eigenschaft hat, die Harmonien abzufangen und zu verfälschen. Die Aussagen des Bankbesuchers vor ein paar Stunden, haben meine Speicherzellen erstmal zur Seite geschoben. Die vielen ungehörten, eher unverstandenen Geschichten, von dem Mann sind mir zwar in den Sinn, minimal aber in den Verstand geraten.Meiner Meinung nach ist es viel praktischer, auf einen Knopf zu drücken, um sich damit einen Titel auszuwählen. Wenn man dann noch ein Video sieht, ist die Transformation meiner Information wohl sicher sauber nutzbar. Wichtig ist doch hier einzig und allein die Konzentration auf meine Melodie, die gut auf das entsprechende Video abgestimmt wurde. Im Grunde habe ich mit den Daten auf dieser Reise zwar Anstöße bekommen, aber mein Durchblick ist noch nicht aus dem Schleier der Unkenntnis heraus. Die schrecklichen Dinge, die mir Erwin in seiner Vorlesung mitgeteilt hat, kann" },
            { src: 'Loop Bug - Dusseline-149.jpg', alt: "ich auch nicht so richtig glauben. Kein Wunder, wenn die Menschen viele Jahre in der Öffentlichkeit wandeln müssen, um sich einigermaßen innerhalb der anderen Mensch-Meinungen zurecht zu finden. Am Eingang des Bahnhofs war ein Werbeplakat angebracht, welches über meine, zu besuchende Ballettvorführung, informierte. Zusätzlich zum Tanz, sollte ein junger Geigen-Künstler zwischendurch auf einer Bratsche spielen. Er war dort auf dem Papier erkenntlich abgebildet. Er hatte längere Haare und soll schon weltweit seine Konzerte gegeben haben. Dieser Junger war demnach ein Newcomer, denn das Gesicht war mir suboptimal vertraut. Meine Datenbank für aktuell bekannte Künstler ist auf dem letzten Stand. Das Zusammentreffen dieser zwei Auftritte traf sich für mich gut. Ballett-Tanz und ein kleines Konzert, um mich eventuell doch noch weiterzubringen, sogar an einem Abend. Man muss hoffen, endlich bald mein Ziel erreichen zu können, genug Daten zu sammeln, damit meine Produktionen den notwendigen Erfolg erhalten. So Mühselig hätte ich mir das Lernen im Chip-Leben nicht vorgestellt.Gemächlich tappten mich meine Füße zum Bahnsteig 4. Hier war die Abfahrt meiner Bahn, die erst in einigen Minuten abfahrbereit gestellt werden sollte. Eine Bank war hier nicht aufgestellt. Daher lehnte ich mich lässig an einen Brückenpfeiler der Halle. Meine Gedanken versank in speicherinterne Knoten, um aus meinen Datenkopfsalat irgendetwas ■ Verwertbares heraus zu ziehen. Dabei werden externe Sensoren abgekoppelt, die nur unnützes Zeug aus der Umgebung aufgabeln würden. Nur meine Ohrempfänger ließ ich auf kleinster Leistung mitlaufen. In meiner unmittelbaren Nachbarschaft fuhren einige Dampflokomotiven ein. Genau die, die vor einhundert Jahren mal gebaut worden sind. Ihr Lärm war erträglich," }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
