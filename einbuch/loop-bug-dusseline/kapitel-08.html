<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Loop Bug - Dusseline-050.jpg', alt: "Die Reise zu den StudentenDas war ja nun eine wirklich nicht hilfreiche Schulung! Was soll man mit diesen Informationen anfangen? Im Grunde bin ich genau so schlau wie vorher. Unglaublich, was sich die Schulungsbehörde der Roboter so ausdenkt. Ein jeder soll selber suchen, na das hätte man sich auch schon vorher denken können. Nicht nur, dass man eigentlich niemals schlauer wird, nein, nun gibt es noch eine Unmenge von Zusatzmaterial, welches in mich einverleibt werden soll. Und vor allem, die komische Aussage, der Klang wäre keineswegs messbar. Wie soll man da noch arbeiten können, wenn es keine Vorschrift gibt, die Etwas genau, präzise, unabänderlich oder unumstürzbar anweist. Das funktioniert meines Erachtens nach, lediglich mit entsprechend vorher genau gemessenen und ausgearbeiteten Detailfragen. Das bedeutet eben, einzig und allein perfekte wissenschaftliche Vorarbeit bringt eine genaue Analyse zu Stande. Dies wird dann verwendet um entweder zufällige Gesetze zu verwenden oder genaue Methoden der Umsetzung für ein Ziel zu erarbeiten. Und dann noch der Superhammer. Je weniger man vorgebildet ist, umso besser soll man das Problem verstehen. Dann hätte ich meine Arbeit ja gleich vergessen können. Die vielen Jahre der Arbeit, alle umsonst. Kein" },
            { src: 'Loop Bug - Dusseline-051.jpg', alt: "Wunder, das die anderen gepeinigten Roboter den Weg der RESET-Initialisierung gegangen sind. Nehme wir mal an, die Lösung wäre gefunden. Was macht damit? Wenn die Menschen nun unempfindlich für diese Information sind, dann können sie auch mit diesem Wissen wohl kaum veranlasst werden, meine Musik als angenehm zu empfinden. Es hat keinen Sinn, etwas sagen zu wollen, wenn es keiner versteht. Das Gesagte -äh- gespielte wäre unverstanden verloren. Man könnte kurzer Hand in ihrer Sprache etwas kreieren. Wenn alles nur laut sein muss, vielleicht auch kratzig und mit ■ Wumm sozusagen, dann wäre genau jene Idee die Beste, die eine Musik hervorbringt, die noch blöder ist, als jene, die sie jetzt verstehen. Was könnte das sein? Am einfachsten wäre es im Augenblick in eine Schrottfabrik zu gehen, sich dort lauter verrostete kleine Schrauben oder Muttern zu besorgen, dann alles in große Blechbüchsen zu stopfen, alles in einen Container zu schütten und diesen Container dann in Drehung zu versetzen. Dieser Lärm an Geräuschen müsste nun zusätzlich noch tausendfach verstärkt werden und ich würde den Menschen dann dieses Gemisch an Sinnfreiheit vor die Füße werfen. Besser kann man ihnen nicht zeigen, welche Evolutionsstufe sie erreicht haben. Vom Affen zum Menschen und zurück kann man feststellen. Meine überaus wichtige Person, als intelligentes selbständiges System, muss sich schon mächtig zusammenreißen, um keinen Moment im ■ Irrenhaus der Roboter zu landen. Lieber dann doch eine Vollsanierung meiner Speicherchips vollziehen lassen. Aber so weit ist es noch nicht. Wie war das jetzt mit dem Besuch in einer Studentenübungsstunde? Wie und als was kommt man dorthin? Im Grunde benötigt man ein kleines Mikrophon, eine Kamera und einen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
