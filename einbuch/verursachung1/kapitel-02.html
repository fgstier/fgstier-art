<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-02.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'das prinzip der zeitlosen Verursachung I-009.jpg', alt: "Ich betrachte meinen hochmodernen Forschungskeller. Bevor weitere Experimente fortgeführt werden können, muss meine bisherige Arbeit doch erst einmal grob auf Papier gebracht werden. Vielleicht kann man dann später einen Vorteil aus den niedergeschriebenen Einsichten gewinnen. Bisher blieb mir jeglicher Erfolg innerhalb der öffentlichen Publikationen aus. Freilich ist diese Tatsache keineswegs so sehr wichtig, dennoch sollte bekannt gemacht werden, in welche chaotische Notlage jede physikalische Außenwelt grade hinein rudert.Viele Jahre lang beschäftigte mich das andauernde Problem, endlich diese Theorie von Allem, die Quantensaga, zu durchleuchten. Alles Mühen, jegliche zeitaufwendige Sucharbeit und jeder Versuch eines erneuten Starts mit frischen Bemühungen war bisher beständig sowie gleichermaßen erfolglos, im dichten Leerraum des Unverständnisses, verloren gegangen. Alle Berichte, Dokumentationen, wissenschaftlichen Abhandlungen als auch andere gelesenen Fachbücher konnten mir im Nachhinein kein konstantes Bild meiner mir erlebbaren Welt bescheren. Natürlich hatte ich manches Mal den Eindruck gewonnen, endlich einen" },
            { src: 'das prinzip der zeitlosen Verursachung I-010.jpg', alt: "Lichtblick und dadurch eine Idee des Verstehens zu erhaschen. Nach einigen Minuten der inneren Freude verschwand dieser leider nur kurz gefühlte Erfolg im Nebel des aufsteigenden Zweifels. Warum sollte man also versuchen, diese Leere meiner unzureichenden Geisteskraft, mit dieser Schrift weitergeben, da doch schon ausreichend Unsinn in zu vielen Buchveröffentlichungen vorhanden ist? Am wichtigsten erscheint mir meine winzige Vorstellung zu sein, einen temporär virtuellen Wellenberg an Anregungen erzeugen zu können, welcher eventuell eine weitere unglückliche Seele erreicht. Was meine Wellen an Energie, in Form dieser Zeilen mit Worten und Sätzen, vermitteln werden, liegt dann im Auge des neuen Verstandes. Die hier verweilenden Mitdenker, müssen wahrscheinlich um ein Vielfaches intelligenter sein, um hier niedergelegte zaghafte Bemühungen meiner Gedankenwelt zu verstehen.Gleichbleibend immer nur mit Hilfe dieser verfluchten Worte, die doch für jeden, im Zusammenhang innerhalb eines Satzes, unter verschiedenen Umständen, eine völlig andere Bedeutung erlangen können. Es ist nicht möglich eine unterschiedliche Betonung zu artikulieren, eine Satzpause, ein virtuelles Komma in diesen Texten zu setzen. Selbst Musiker sind ausgereifter qualifiziert, eine Unmenge von Zeichen auf ihrem Notenblatt zu notieren. Dort sind Lautstärke, Geschwindigkeit, besondere Akzente, Toneigenschaften oder Wiederholungen für besondere Betonungen, überall mit verschiedenen Bildern einer Kennzeichnung möglich. Die Sprache der Musik ist daher auch um viele Male reicher mit speziellen Informationsdiamanten bestückt, als diese hierpraktizierte primitive Form der niedergeschriebenen Sprache in Form von Text. Wenn man nun mit einem Vehikel an Buchstaben" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
