<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-08.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 3</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'das prinzip der zeitlosen Verursachung I-078.jpg', alt: "Nachdem meine weinerlichen Jammerüberlegungen im endlosen Weltall der Buchstaben verflüchtigt sind, sollte man noch folgendes feststellen dürfen. Ich darf an dieser Stelle schließlich solche absonderlichen Gedanken auch schriftlich niederlegen, weil diese Schrift mehr schlecht als recht als wissenschaftliches Dokument definierbar sein wird. Emotionale Gefühle sind hier ebenso freudig willkommen, wie fundierte Hintergrundinformationen in physikalischen, psychologischen und phantastischen Gebäuden. Abschweifungen sind allerdings auch notwendig, die Wichtigkeit einer neuen Analyse klar zu punktieren. Mit bekannten Informationen kann kein sinnhafter Neuanfang produziert werden. Die Bejahung alter Kenntnisse setzt die Schiene am Horizont nur weiter fort. Und diese Schiene ist genau dasjenige Stück Weg zum Horizont, welche eingeschmolzen werden muss, um mit dem Stahl weiterzuarbeiten.Meine Zweifel an bestehenden Strukturen werden im Basisexperiment des weit bekannten Doppelspaltmysteriums offenbart. Wer dieses Experiment nicht kennt, ist bisher geschützt" },
            { src: 'das prinzip der zeitlosen Verursachung I-079.jpg', alt: "vor dem geisterhaften Undenkbaren, welches die moderne Wissenschaftsmythologie begründet. Es kann an dieser Stelle gewiss nicht meine Aufgabe sein, derartige wohlargumentierte vielfältige Experimentalphysik meiner wissenschaftlichen, von mir leider abseitsstehenden Kollegen, zu dokumentieren.Es ist nur ein großes Leiden erkennbar, dass man mit Hilfe dieser traditionell noch unverstandenen Projektionen der Realität, ein Universum an Mathematik geschaffen hat, die keine Interpretation der tiefgründigen Materien-Struktur zulassen kann. Sie beschreibt und ist Hilfsmittel für die Suche nach neuen Ergebnissen. Diese liegen nur in der Mathematik selbst, die es dann gestatten mit gesuchten Ergebnissen physikalisch in die Zukunft zu schauen um dort die Materialisierung zu realisieren. Sie zeigt die Zukunft durch Geschick formuliert, mit einer wahnsinnig genauen Wahrscheinlichkeit der Unbestimmtheit.Es wird weiterhin geforscht, wobei eine mentale Denkkultur zur Seite gelegt wird, um nicht Abtrünnig allein aus der Wüste der eingeschliffenen Richtungen zu fliehen. Die Flucht macht auch kein sinniges berufliches Vorankommen denkbar. Also lasst uns unentwegt tiefer in ein Moor der Lehrsätze versinken? Nein, bloß nicht innerhalb dieser Schrift! Hier bin ich frei von irgendwelchen Literaturangaben, frei von Zwängen der vernünftigen Gedanken, frei von modellhaften Methoden und frei von der Mathematik, die alles verwischt, verschleiert, unangefochten verfälschen kann. Und das alles mit ausgeklügelten Herleitungen und Beweisen. Man sagt, die Mathematik ist eine saubere Logik und die Physik ist schmutzig, mit Näherungen oder Wegrundungen behaftet. Mein Kopf ist voll von diesen logischen, bildungsbehafteten Vorschriften, durchaus sehr überzeugenden Modellen, wunderbar erklärten Phänomen oder kraftgestützten vielseitig verwendbaren Formeln. Doch was hat mir die gelernte Wissenschaft für meine eigene Gedankenwelt an Sinnhaftigkeit gebracht? Nur Wahrscheinlichkeit und Unbestimmtheiten. Mythen der Eventualitäten und niemals" },
            { src: 'das prinzip der zeitlosen Verursachung I-080.jpg', alt: "abzählbaren Unendlichkeiten sind mir in das Bewusstsein gedrängt worden. Logisches Erkennen ist mir mehr und mehr entschwunden. Wenn mein Geist doch schon mal die elektrische Spannung, eine mechanische Kraftwirkung, eine sonderbare Chemie der atomaren Strukturen begriffen haben sollte, sind mir in der Zwischenzeit viele dieser Bezeichnungen völlig aus meinem Sinn entflohen. Mag es eine Art Wahnsinn sein, der zu diesem Verlust an Überzeugung für die fortschrittliche Mentalität geführt hat. Jedenfalls ist das Doppelspaltexperiment sogar dazu geeignet, die Unzulänglichkeiten der in vielen Büchern verfassten Widersprüche aufzuzeigen. Der Kompass der strengen naturwissenschaftlichen Segelkarte ist heraus gerissen aus dem wegweisenden Kartenmaterial. Es ist allerdings keineswegs das einzige sturmbringende Wunder innerhalb der modernden Konzepte. Es gibt noch ein paar Weitere. Die Verschränkung zeigt uns ebenso eine unbegreifbare Natur und sollte uns eine Warnung dafür sein, dass wir nur Geschöpfe der Natur sind, die eben genau keine Sekunde begabt sind, die grundlegenden Funktionen einer Welt zu erkennen. Man sollte aber bemüht sein, innere Knoten einer verstaubten Denkweise zu lösen, um mit anderen Mitteln einen neuen Weg abzustecken. Nun wird ein jeder wohl fragen müssen, ob man mit diesem klugen daher geschriebenen etwas Neues erreichen kann. Im Augenblick ist sicher, dass das Ende einer Einbahnstraße der gegenwärtigen Physik erreicht wurden ist.Es geht schon seit einigen Jahren fast aussichtslos langsam im Kreis. Kein neuer Horizont innerhalb der Quantenwüste ist sichtbar. Man klammert alle Hände an das sinkende Schiff und hofft auf ein Quantenwunder. Die Forschungen bewegen Inhalte durch ein mathematisches Konstrukt in einer theoretisch formulierten Form." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
