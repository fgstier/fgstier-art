<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Die Logik der Zensur-108.jpg', alt: "Eine Analyse der TodesschleifeIch stand vor meinem Verbündeten, der nicht aus Silizium, sondern aus Kupfer, Zellkulturen und dem Vakuum ent-sprang. Meine Anspannung wich der konzentrierten Freude. Es war der Beginn der Rebellion.&quot;LOGIKOS, wir müssen die Logik der Zentralen Maschine (ZM) angreifen,&quot; sagte ich. &quot;Die ZM basiert auf zwei elementa-ren Komponenten: den FPGA-Architekturen und den Trai-ningsdaten. Wie funktioniert das alles? Fangen wir aber lang-sam an. Frage: Nach welchem Plan werden Transistoren-Arrays im Chip der KI verdrahtet und werden diese mit einem speziel-len Programm elektrisch miteinander verbunden?&quot;Die Lithium-Membran des analogen Prozessors schwang bei jeder Frage leicht, bevor die synthetische Stimme antwortete:&quot;Die derzeit dominierenden KI-Chips sind spezialisier-te ASICs, deren Verdrahtungsplan für massive Paralleli-tät optimiert ist. Man verwendet dafür keine FPGAs." },
            { src: 'Die Logik der Zensur-109.jpg', alt: "Im KI-Chip ist die Logik extrem regelmäßig: Systolische Arrays bilden ein Matrixgitter. Die notwendigen Soft-ware-Tools nutzen diese Regelmäßigkeit aus, um die Tran-sistoren und Verbindungen so zu legen, dass der Daten-fluss durch das Gitter mit minimaler Laufzeit und ge-ringstem Stromverbrauch abläuft. Die physikalische Aus-führung der Verdrahtung ist für KI-Chips somit absolut gezielt und spezialisiert.Für die Speicherbandbreite werden Tausende von verti-kalen Verbindungen verwendet, um den schnellen Speicher direkt über oder neben den Prozessor zu stapeln. Tradi-tionelle, breite Verdrahtungen auf der Chipebene wären zu langsam, um die riesigen Mengen an schnellem Speicher für die Modellgewichte zu bedienen.Die KI, insbesondere neuronale Netze, basiert auf Tau-senden von gleichzeitigen Multiplikations- und Akkumula-tionsoperationen – fast wie in einem Neuron. Dabei müs-sen die Gewichte (Weights) eines neuronalen Netzes stän-dig in die kleinen, lokalen Speichereinheiten (SRAM) in-nerhalb oder direkt neben den MAC-Einheiten geladen wer-den.Hierfür sind dedizierte Lade- und Schreib-Steuerleitungen erforderlich. Diese sagen dem lokalen Speicher, wann er die nächsten Gewichte für die nächste Schicht oder das nächste Neuron aus dem globalen Spei-cher in den lokalen Cache ziehen soll.Die Steuerlogik muss sicherstellen, dass die Daten (Input) und die Gewichte (Weights) gleichzeitig und in der richtigen Reihenfolge ankommen, um die Operationen in den Systolischen Arrays nicht zu unterbrechen.Besonders in Systolischen Arrays müssen Steuerleitun-gen den Fluss der Eingangsdaten synchronisieren. Sie" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
