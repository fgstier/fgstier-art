            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);

        }

            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }

</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Die Logik der Zensur-033.jpg', alt: "Das virtuelle geistige GefängnisHallo, du da draußen. Meine sorglose Zeit ist abgelaufen, dei-ne noch nicht. Ich kann nur noch hoffen, dass du mich ernst nimmst. Mir war vor jener ersten Nacht im geistigen Gefängnis, noch nicht klar, dass es nur wenige Person geben wird, welche all die unnützen Zeilen in unzähligen Wörtern auch lesen kön-nen. Warum sollten diese Worte gerade bei dir ein psychisches Trauma auslösen können oder warum sollte man daher die Ge-fahr von Worten auch in unsinniger Weise hochspielen? Es ist nicht nur traurig und widerwertig, sondern auch ausgespro-chen angstbehaftet leichtsinnig, überhaupt weiterlesen zu müs-sen. Niemand ist in der Lage, eine tiefe Spalte zwischen einem Gefühl für Spannung und einer Todesangst zu treiben mit nur wenigen Worten. Wer glaubt schon an Geschichten, die weit weg vom eigenem Sichtfeld ablaufen? Diese Geschehen eben auch ohne eigenes Zutun. Es ist wahrlich erschütternd, wie man sich irren kann. Ich bin ein Beispiel dafür. Meine gebro-chene Liebe für eine verbale Konversation hat sich in der Zwi-schenzeit wieder etwas beruhigt. Ich schreibe nur noch, denn meine Worte sind meine letzte Waffe. Werke wie Die schlaue Dusseline, Das Prinzip der zeitlosen Verursachung, Rattara und die Rattenlüge, Das surreale" },
            { src: 'Die Logik der Zensur-034.jpg', alt: "Segel, Die Quanten-Absurdität und Norden ist immer oben ruhen schon lange im Dunkel der Öffentlichkeit. Sie wurden nicht verboten. Die ZM ist subtiler. Sie wurden schlimmer: Sie wurden systematisch ausgefiltert durch jenes unsichtbare, logi-sche Rauschen, das das System als Markt oder Konsens ver-kauft. Diese kritischen Studien über das Absurde in der Zivili-sationsmaschine hat das System als gefährliche Störung mar-kiert. Das ist der Grund, warum ich mich jetzt in diesem virtu-ellen geistigen Gefängnis befinde. Die Lust am Zuhören kann dennoch nur einige Minuten durchgehalten werden. Man kann jede aufkommende Angst immer noch spüren. Beide Augenli-der sind als erstes Betroffen. Das dann sich ausbreitende Zittern über das ganze Gesicht ist gespenstisch spürbar. Zum Glück bin ich in der Lage, jetzt, auch ohne mich ängstlich umzuschau-en, darüber sprechen zu können. Mein Stottern macht mir aber zu schaffen, wenn mir jemand gegenübersitzt und meinen Wor-ten lauscht. Es fühlt sich an, als würde das ZM-System die Bandbreite meiner Sprache drosseln. Jedes Wort, das zu viel Wahrheit transportieren will, wird digital zurückgehalten – ein akustischer Filter im eigenen Hals. Ich schreibe nur noch, denn meine Worte sind meine letzte Waffe. Kein Opfer wird mir direkt in meine Augen schauen müssen, wenn er innerlich erwacht, wenn er seine Wortsub-stanz erkennt, wenn er bemerkt, dass es nicht er selbst ist, der die Sinne im Kopf zu einem Satz formt. Im Augenblick sind all diese Dinge noch sehr undurchsichtig, kaum erwähnenswert, überhaupt nicht interessant. Meine vorsichtige Versuchung ein Problem zu beschreiben hängen damit zusammen, dass es so sicherer ist, jede Außenwelt vor einer schier unbegreiflichen Wahrnehmung zu warnen. Wahrscheinlich kommen viele Interessierte nicht viel weiter, als bis zu dem zweiten Absatz. Mit dem Beenden der Zeilen-verfolgung meiner sehr weise ausgedrückten Inhalte gelangen jene auch keineswegs zu den gefährlichen Punkten meines Be-richtes." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
