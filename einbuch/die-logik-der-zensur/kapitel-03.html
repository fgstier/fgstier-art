<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Die Logik der Zensur-018.jpg', alt: "Das Protokoll der AnomalieKriminalhauptkommissar Werner Knopp kam gestresst in das Büro. Das schlimmste was ihm früh passieren kann ist der ner-venaufreibende Stau auf der Autobahn. Er brauch normaler Weise nur ein paar Minuten aber wenn sich die Fahrzeuge dort fast schon übereinander stauen, dann ist alles zu spät. Seine Gedanken verweilen derweil schon auf seinem Sitz im Büro. Das Lenken, die Gänge schalten und eventuelles Bremsen ge-hen wie automatisch allein. Man könnte meinen, das wäre ein Zeichen seiner systemischen Konditionierung.Sein Körper handelt praktisch schon wie ein fehlerfreier Al-gorithmus, auch wenn sein Geist abschweift. Manchmal weiß er nicht, wie er überhaupt ankommt, so vertieft ist er bereits bei seiner Arbeit. Bisher ist sein Fahrstyle aber durchaus unfallfrei geblieben. Ein paar Geschwindigkeitsüberschreitungen oder möglicherweise ein gekappter Seitenspiegel gehen auf seine Unaufmerksamkeit zurück. Wie fast immer war er der letzte Mitarbeiter, der sich an sei-nen Arbeitsplatz setzte. Dafür war seine Überstundenliste ent-sprechend lang. Im Landeskriminalamt in L. war er seit einigen Wochen mehr am Schreibtisch als im Außendienst tätig. Seine" },
            { src: 'Die Logik der Zensur-019.jpg', alt: "Arbeit bestand diesbezüglich zunächst in Sachen ablegen, Tisch ordnen, Kaffee kochen und ihn dann in der Küche kurz antrin-ken. Er war im Tagesdienst eingeteilt, hatte keine Uniform, da er immer in Zivil ermittelt. Ohne Kaffee läuft hier im Revier nichts. Seine Überstunden waren in dieser Woche extrem ange-wachsen, seine Laute daher sehr angespannt. Ein wohlverdien-ter Urlaub stand kurz bevor, wenn man bei zwei Wochen vor dem Urlaub überhaupt schon davon reden könnte. Seine Reali-tät war keineswegs so, wie man es im Fernsehen sieht. Von we-gen im Auto sitzen und irgendwelchen Verrückten hinterherja-gen oder Zeugen vernehmen, Wohnungen durchsuchen, even-tuell schnell mal Täter entlarven und verhaften. Das sind Din-ge, die eher selten vorkommen. Was ist jeden Tag zu tun? Man hat ständig irgendwelche herbeigeschaffte Akten von Kollegen auf dem Tisch. Ab und zu wird Veranlasst Rauschgift und di-verse andere Stoffe untersuchen zu lassen. Gestern wurde auf Grund eines richterlichen Beschlusses eine Wohnungsdurchsuchung angeordnet. Die gefundenen Beweismittel müssen jedes Mal dann regelkonform in ver-schiedene Asservatenkammern deponiert werden. In den letz-ten Wochen gab es einige Fälle von Betrug, Raub, Einbruch und sogar ein Sexualdelikt. Es wurden Spurensicherungen vor Ort durchgeführt. Einige lästige Tatortarbeiten wie Zettel ver-teilen oder operative Beweismittelsuche sind immer notwen-dig. Sehr oft sind Mobiltelefone zu beschlagnahmen und dann im Büro zu knacken und auszuwerten. Das ist alles sehr zeit-aufwendig, weil ja auch immer über alles Buch geführt werden muss.Sein Kollege Lukas Voller war einige Jahre jünger als er, aber hatte auch schon einige Berufsjahre mit ihm gemeinsam hier am Ort absolviert. Sie saßen sich beide an aneinanderge-stellten Tischen direkt gegenüber. Das hatte den Vorteil, dass man sich Unterlagen gleich über den Tisch reichen konnte. Da die Computerbildschirme drehbar aufgestellt worden waren, war es kein" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
