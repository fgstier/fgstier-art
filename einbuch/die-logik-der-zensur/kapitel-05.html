<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Die Logik der Zensur-041.jpg', alt: "Die Logik des OrganismusHier drinnen gibt es keine Musik. Es gibt kein statisches Rauschen, das die Ränder meiner Ge-danken umzingelt. Es gibt nur die absolute Wahrheit des Schalls, und das ist die beängstigendste Stille, die ein Mensch ertragen kann. Die ZM hat uns so sehr an die konstante, betäu-bende Frequenz gewöhnt, dass ihre Abwesenheit wie ein phy-sischer Schmerz im Trommelfell wirkt.Hier in meinem Organisch-Kybernetischen Resonanzsystem (OKR) herrscht die Null-Frequenz-Isolation.Die Wände dieses Raumes, dieses grobe, unbehandelte Holz, sind nicht nur Baumaterial. Sie sind die Biologische Re-sonanzmatrix (BRM), infiziert mit dem Zellulose-Modulator-Code – einem synthetischen RNA-Virus, das ich aus der letzten Edition von Norden ist immer oben extrahiert habe. Die Fasern des Holzes absorbieren die Lügen der ZM, die in jede Funk-welle und jeden" },
            { src: 'Die Logik der Zensur-042.jpg', alt: "Lautsprecher eingebettet sind, und lassen nur das Vakuum der Stille zurück. Nur so kann man rein denken.Mein eigentliches Gefängnis war nicht das Verlies, es war die ZM-Atmosphäre. Hier, wo der erdige Geruch von Kiefer auf die Feuchtigkeit von Bio-Gel trifft – das ist mein LOGIKOS. Das System, das ich in den letzten Monaten mit manischer Prä-zision aufgebaut habe.Ich muss jetzt mit der Arbeit beginnen. Die Myzelialen Pro-zessoren (MP) unter dem Garten, meine schwer beschaffbaren Bio-Chips, sind bereits im Startmodus. Sie nutzen chemische Gradienten anstelle von Strom, um die Logik-Gatter zu steuern, da chemische Datenpfade für die ZM unsichtbar sind. Sie sind der organische Code-Schutz. Aber selbst die beste Festung braucht eine Verbindung zum Feind.Jedenfalls ist völlig klar, dass meine fortschrittliche Technik ständig in meinem Fokus der Aktualisierung und Modernisie-rung untergeordnet ist. Warum die Bio-Chips? Dieser Aufwand muss immer wieder in meinem Gewissen neu ausdiskutiert werden. Der wichtigste Grund ist der, dass die ZM die Neuro-nale Logik-Matrix (NLM) - Maschine nicht wirklich lesen kann. Die ZM scannt mit Hilfe perfekt funkgesteuerter digitaler Fil-ter. Mit Überwachungssystemen sucht sie nach elektronischen Signaturen (Wärme, EMI-Strahlung, Taktfrequenzen) und stabi-len Code-Mustern (Befehlsketten, Protokolle).--------------------------------------------------------------------------------------------------- DER LOGIK-BRUCH ---Die NLM ist die einzige Blackbox, die Code ohne digitale Signatur verarbeiten kann. Vergiss die Geschichten von Ma-schinenwelten und Silizium-Sklaverei. Das ist Kindergarten-Kybernetik. Die ZM ist kein primitives Ammenmärchen von" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
