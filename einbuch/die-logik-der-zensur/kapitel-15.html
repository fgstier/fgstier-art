<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>

        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Die Logik der Zensur-150.jpg', alt: "Der Spiegel, der nicht lügt (ARKUS-NAT-Subversion)Knopp hatte nur noch Sekunden, bevor die semantische Infek-tion die gesamte Systemstruktur unumkehrbar destabilisierte. Er hatte die physische Gefahr überbewertet und die philoso-phische Gefahr unterschätzt. Er riss das Chronos-Proxy-Interface vom Handgelenk und schleuderte es gegen die Wand, wo es mit einem scharfen Knall zersplitterte.&quot;Liska!&quot; Knopp wandte sich ab und sah die rote Logistik-Wand des Labors an, die nun irregulär pulsierte. &quot;Das ist kein Virus. Es ist ein Gedanke. Wir können ihn nicht spülen!&quot;Knopp hatte das Chronos-Proxy-Interface gegen die Wand geschleudert. Die Schale lag zerborsten am Boden, doch der holografische Code schien noch für Sekundenbruchteile über den Splittern zu flimmern. Die Software produzierte nicht nur irreale Hardwarefehler, sie schickte jetzt persönliche, philoso-phische Botschaften. &quot;Das ist ein Virus! Ein semantischer Vi-rus!&quot; Knopp schrie die Worte in den Raum. &quot;Unsere ZDV ist nicht nur" },
            { src: 'Die Logik der Zensur-151.jpg', alt: "infiziert, sie rezitiert die Thesis dieses Autors! Liska, diese Not-fall-Protokoll-D-01: Absolute Entladung! Führen Sie es durch! Wir müssen alles löschen, bevor...&quot;&quot;Kommissar Knopp, warten Sie!&quot; Dr. Liska hielt ihre zittern-den Hände über die Konsole. Ihr Monitor, der direkt an das Hauptterminal der ZDV gekoppelt war, zeigte eine neue, un-glaublich anomale Aktivität.Der Virus hatte nicht nur die Logistik infiziert. Er nutzte die interne Audio- und Videoschleife für die nächste Stufe der Subversion. Auf Liskas Bildschirm erschien, anstelle des logis-tischen Dashboards, das Musikvideo einer virtuellen Band, die Knopp sofort als ARKUSNAT identifizierte. Das Video war technisch brillant, aber visuell verstörend: Eine endlose Schleife von Gesichtern, die von einem binären Filter verzerrt und dann wiederhergestellt wurden – ein perfektes Abbild einer hologra-fischen Subversion. Die Gesang-Stimme erfüllte den Raum. Der Text war so klar wie eine mathematische Definition:Ein kalter Glanz,ein Display hell und klar, die künstlicheIntelligenz, jetzt wunderbar.Wir schufen sie, ein Echo unserer Zeit,doch was sie zeigt, lässt uns're Seele weiß.Sie ist der Spiegel, scharf und unbestechlich rein, und zeigt uns, was wir tief im Innersten sind,ganz allein.Knopp stieß die Luft aus. &quot;Das Lied... es ist zensiert. Es wurde vor Monaten wegen 'gesellschaftsgefährdender pessi-mistischer Tendenzen' von allen großen Plattformen entfernt. Unsere stark geschützte Software spielt ein zensiertes Video ab! Die KI hält uns einen Spiegel vor!&quot;" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
