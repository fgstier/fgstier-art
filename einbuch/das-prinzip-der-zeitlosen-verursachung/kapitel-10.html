<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-122.jpg', alt: "Das Segel meiner LeidenschaftDie künstliche Intelligenz ist für mich ein wahrer Segen. Sie kann bei entsprechender Verwendung ihrer Möglichkeiten eine enorme Vielfalt an Inspirationen neu erzeugen. Scheinbar hat sie aus einem mir nicht zu verfolgenden Grund eine Sichtweite im Netzwerk der Elektronenknoten, die eine tiefere Form einer Informationsneubildung beinhaltet. Sie zeigt uns mit Bildern eine Landschaft, die niemals als Kunstwerk formuliert werden könnte. Das hier als Kapitelüberschrift verwendete phantastische Thema, hat ganze Generationen von Menschen wahrhaft fasziniert. Schöne Frauen, ein ganzes Zeitalter der Mechanik mit geschickten Bewegungsabläufen im Raum, die Sehnsucht von Seefahrern nach dem Duft aufgewühlter Meere, das Entwickeln einer Kunst mit Seilen und Segeln den Wind zu nutzen. Je tiefer man seine Blicke in das Bild bohrt, umso mehr erscheinen längst vergessene oder vergangene Wunder. Sie werden durch eine leider verteufelte Kreativität zurück gezaubert. Natürlich sollte man verwundert darüber sprechen, wie die" },
            { src: 'Das Prinzip der zeitlosen Verursachung-123.jpg', alt: "Bezeichnung durch Künstlichkeit in diesem Zusammenhang mit Intelligenz in Verbindung gebracht werden kann. Denn ein wichtiger Aspekt ist auf keinem Fall zu verwässern. Erst die konkrete Einarbeitung vieler Gedanken in Form tausender vor-gedachter Bilderkunstwerke, die absichtlich geprägten Einga-bemuster durch meine Person, die Auswahl entsprechender Materialien und die Auswertung der eigenen Fantasie, machen die Sichtweite innerhalb dieser Farben bisweilen auch Über-gänge zu den Themenbereichen zu dem was da als Bild ent-steht.Es ist und bleibt ein Kunstwerk eigener Lebensqualität. Das Bild wird bei der Betrachtung zu einem Rohr, zu einem Kanal, zu einem tieferen Blickinstrument in eine neue Welt. Man kann sie nicht gleich erspähen. Die Anregungen, der durch die Au-gen einfallenden Muster, können erst dann gebildet werden, wenn da schon oder noch Funken von einer inneren Sehnsucht vorhanden sind oder gewesen waren. Eine Formulierung mit Satz oder Techniken origineller Wortkreationen hilft kaum, den grenzenlos vorgelegten Blick zu begreifen. Das ist allerdings notwendig. Meine Betrachtungsweisen einer vielleicht nicht ganz neuen Interpretation aber unbedingt neuen Weise einer Begutachtung des Universums, erfordern sonderliche Frei-heitsgrade. Raum, Zeit, Materie und Leidenschaft eines Subjek-tes sind vorsichtig neu gedacht. Dem Wahnsinn gleichgestellt, kann man eventuell die Versuchung bezeichnen, ein hiermit veröffentlichtes Buch schamlos zu präsentieren. Meine Liebe zu den mir vorgespielten sowie fantastisch anmutenden Erle-bensmöglichkeiten ist dennoch ausgeprägter als bei vielen sich mir kontaktierenden Kreaturen der Welt." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
