<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-035.jpg', alt: "Die Hexe der Gleichheit Eine Hexe der versteckten Erkenntnis treibt ihr Unwesen mit besonderer Hinterhältigkeit. Ein Hochofen der Materie ist innerhalb der Natur an jedem Ort, jeder Zeit, auf Ewigkeit be-reit, eine perfekte Präsentation hinzulegen. Dieser Ofen des Teufels schmiedet unablässig eigene Verbindungen, seltsame Objekte, mitunter permanent anziehende Klumpen an diversen sichtbaren sowie unsichtbaren Teilen einer Masse mit noch viel kleineren Stückchen der gleichen Art. Felder von Zahlenkolon-nen mit gerichteten unbekannten Zielen. Diese unzähligen kleinsten Stücke des allumfassenden Breies, erzählen dauerhaft eine arglistige Geschichte. Sie liegt unsichtbar, geheimnisvoll, für alle Zeit versteckt. Die stummen Diener der gesteuerten Zusammenhänge" },
            { src: 'Das Prinzip der zeitlosen Verursachung-036.jpg', alt: "sind zwar überall wirksam, nur lassen sie keine klare Trennung untereinander erkennen. Sie kleben wie Leim als kompakte Masse zusammen. Man kann sie mitunter zählen, lachen aller-dings dem Zähler rücklings, wie bei einem räumlichen Spiegel, ins Gesicht. Sie, die Atome, unterscheidet man im Grunde schwerlich präzise untereinander. Es gibt scheinbar keine un-endliche Vielfalt von ihnen. Die wenigen Verstrickungen eini-ger Teile, und seien es auch ein paar dutzend, sind alle fast gleich. Sie sind nicht zu orten, besitzen keine persönliche Kennzeichnung, man kann kein Etikett dort symbolisch ankle-ben. Alle sind gleichartig, funktionieren ewig ununterscheidbar identisch, haben gleiche Beziehungen untereinander, sind per-fekt aneinander angepasst, haben keine wesentlichen Unter-scheidungen vorzubringen. Einmal benannt, sind sie überall vorhanden, unabhängig konform und dennoch nicht erkennbar verschieden von gleichartigen Teilchen. Sie kommen und ge-hen. Sind sie wirklich verschwunden oder aber nur umgetauft für eine bestimmte Zeit? Die Theorie dieser Atome macht mir unentwegt furchtbare Angst. Eine riesige Fabrik mit unbe-schränkt funktionierenden gleichartigen dennoch verschieden gezählten Individuen, die den Anspruch eines einzelnen Teil-chens besitzen, trotzdem niemals wieder erkannt werden kön-nen. Jede Funktion eines Teiles kann von deckungsgleichen Teilen ersetzt werden. Man kann unter keinen Umständen er-kenn, welches Teil aus den unzähligen Mengen der Gleichar-tigkeit der Funktion ausgetauscht wurde. Eine abartige Mög-lichkeit alles mit allen auszutauschen, ohne die Funktion zu beeinträchtigen. Die Elektronen wandern von einer Stelle zur anderen. Sind sie am Ziel angekommen oder sind sie nur an gleicher Stelle durch andere Elektronen ersetzt worden, hat wirklich etwas eine Bewegung angestoßen und wenn ja, wie ist dieser Vorgang abzählbar? Jedes Elektron hat eine bestimmte, endlos gleiche Eigenschaft. Kann man etwas" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
