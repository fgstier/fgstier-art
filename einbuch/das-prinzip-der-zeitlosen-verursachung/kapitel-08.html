<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-103.jpg', alt: "Postulate für die zeitlosen EigenschaftsknotenDie Nacht war ausgesprochen kurz, der zeitliche Aufwand für das Frühstück kaum zu ertragen. Mein Forschungskeller ist ein Ort, an dem meine Leidenschaft in jeder Ecke verwurzelt ist. Überall findet man kleine gewonnene Erkenntnisse in Form defekter Röhren, kaputter Lautsprecher und auch Asche von Kohle, die aus den verschiedenen Hochöfen meiner Wissenschaftskunst übriggeblieben ist. Irgendwann muss man auch den Staub von den Lehrbüchern wischen und etwas mehr Ordnung machen. Nur habe ich zunehmend einen extremen Mangel an Zeit, um mich mit derartigen Tätigkeiten abzulenken. Die Zeit wird aufgefressen durch Essen, Schlafen, Denken sowie auch Verpflegung oder Heizmaterialien besorgen, schriftliche Notizen anfertigen als auch mühevolles Durchstöbern von Buchbänden. Es ist wirklich keine Zeit übrig. Der letzte Tag brachte mir einen Durchbruch im Bereich der Atome und" },
            { src: 'Das Prinzip der zeitlosen Verursachung-104.jpg', alt: "Quanten. Endlich gab es einen Riss in dem Raum meiner Ver-gangenheit. Eine Idee, die nur mit schaufelartiger Mühe aus dem Müll der Gedanken ausgegraben wurde. Ich muss mich sehr sorgfältig um eine systematische Aufarbeitung der mir nun anstehenden Erkenntnisse bemühen, damit sie nicht im ungeheuer schnell vergehenden Zeitrahmen, der mir zur Ver-fügung steht, entschwinden. Was war geschehen?Mir ist die zeitlose Strukturverursachung in den Sinn ge-kommen. Sie hat die ureigenste Methode verinnerlicht mir eine reale Struktur vorzugaukeln, die noch dazu scheinbare Natur-gesetze erzeugt und eine Zeitrasterung ins Leben ruft, die dadurch auch den Raum in die Welt wirft. Alles nur Struktur, die Eigenschaften als Bewegung deklariert und manifestiert in Form von Teilchen, Wellen und alles was dazwischen liegt. So richtig überzeugend wird der ganze Matsch an Gehirnproduk-tion erst dadurch, dass man auch die wichtigsten global nie-dergeschriebenen Beobachtungen nachvollziehen kann. Leider kann die Mathematik nur fehlerhaft verwendet werden, da die-se wie bereits beschrieben, durch und durch von dem Gedan-kengut der Vergangenheit verseucht wurde. Diese Logik gibt die Problematik der Begründung einer völlig neuen Logik ein-fach alles andere als sicher her.Der letzte Gedanke war der, das Verschwinden von Photo-nen zu beleuchten. Selbst die Wahrscheinlichkeit darf niemals als Grund vorgeschoben werden, denn diese entsteht ebenso erst durch die Strukturverwirrungen viel später im verbogenen Denkapparat.Da alle bezeichneten Objekte nur Knoten von Eigenschaften sind, ist es überhaupt kein Problem, diese zickig um die Ecke zu denken. Sie, die Ursachen, dürfen jederzeit überall sein und dementsprechend auch ihre Aufgaben untereinander austau-schen, da man sie sowieso unter keinen Umständen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
