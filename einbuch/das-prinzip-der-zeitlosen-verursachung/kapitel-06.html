<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-077.jpg', alt: "Der Up-down-WahnsinnMein erster Versuch erbrachte verständlicher Weise kein anderes Ergebnis zu Stande als jenes, welches schon bekannt gemacht worden ist. Mein Silberversuch mit dem Hochofen erzeugte die bereits erwähnte Zweipunktverteilung des Silberstrahles. Es entstanden zwei Aufschlagspunkte an der Wand gegenüber dem Hochofen. Wenn man mit der Kurbel an dem Magnetfeld in der Art und Weise drehte, dass man das Feld wie in einer Kugel in alle Richtungen bewegen konnte, wurden konstant wieder nur zwei Punkte sichtbar. Also egal, in welche Richtung man den sprichwörtlichen Hochofenbogen spannte, es entstanden unentwegt nur zwei Druckstellen an der Auffangwand. Man konnte somit das gesamte mir umgebende Registrierungsblech mit einem Kreisabdruck beschießen. Der ganze Raum war bereits gekennzeichnet von jeweils zwei Brennpunkten der Silberstrahlen. Bereits jetzt schien mein Verständnis der Dinge im Dunkel dieser Vielfalt abzudriften. Schießen kann man nur mit Teilchen schießen und etwas treffen wollen. Und wenn man die" },
            { src: 'Das Prinzip der zeitlosen Verursachung-078.jpg', alt: "Einbildung besitzt eine Eigenschaft zu messen, sollte sich aus-nahmslos nur ein Ergebnis einstellen und nicht die vielen un-terschiedlichen Ergebnisse, egal wohin man gerade mit dem Magnetfeld zielt. Wenn man demnach am Magnetfeld dreht, dann ändert augenblicklich auch die Richtung der zwei Auf-prallorte? Das Einzige, was konstant sichtbar blieb, war die Tatsache, dass zwei verschiedene Aufprallpunkte wie in einem Kino miteinander auftraten, die alle Zeit absolut gegenüber verortetet werden sollten. Allerdings je nach Orientierung des Magneten entsprechend irgendwo anders. Es sah so aus, als ob die zu bewegenden Stücke des Silbers durch die Messappara-tur ausgerichtet wurden. Wie soll man nun daraus eine Eigen-schaft für die Silberteile festlegen können? Diese Dinger haben demnach nur die alleinige Eigenschaft, eine schlaue Adaption vorzunehmen. Entweder so, oder genau entgegengesetzt. Man erzeugte mit jener Apparatur dauernd genau die Eigenschaf-ten, die man ursprünglich eigentlich unabhängig des Messauf-baues messen wollte. Das Durchrühren der Silbersuppe brachte leider keinen Unterschied zuwege. Diese Messung war keine Messung, so wie man meinen sollte. Wenn ich mit meiner Ap-paratur die Messung beeinflussen konnte, dann geschieht et-was mit dem Silberstrom, was mir freilich unklar war. Die Verwunderung darüber, dass durchgehend nur zwei Vorzugs-richtungen sichtbar waren, kam mir dagegen schon fast weniger abnormal vor. Natürlich nur, wenn man dieses Problem etwas verdrängt. Bei genauer Betrachtung entsteht hier ein vielfach komplizierteres Problempaket. Diese zwei Punkte sind in der Summe je zur Hälfte vorhanden, wenn man über einen länge-ren Zeitraum mitzählt. Manchmal unterschieden sich die Auf-schlagsmengen nur um einige kleine Prozentwerte, ein anderes Mal um dutzende Prozentpunkte. Die Punkte wurden auch nicht regelmäßig in einer speziellen Reihenfolge der Aufschlä-ge gebildet. Manchmal konnte man zehn und mehr" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
