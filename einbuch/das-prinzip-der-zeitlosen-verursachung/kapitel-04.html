<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-052.jpg', alt: "Das WasserfalldilemmaDiese atomar kleinen Teilchen, angetriebene fliegende Dinger, hervorgerufen durch versteckte Teufelsbraten, können in einem heißen Ofen erzeugt werden. Genau wie in der Hölle, muss das Feuer nur heiß genug geschürt werden. Dazu habe ich schon einen Hochofen vorgeheizt, der im Keller hier mit Koks beheizt werden kann. Aufkommender Qualm wird über ein speziell dafür angelegtes Rohrsystem nach außen geführt. Wichtig ist nun allerdings nicht die Idee, dass durch die Kammer etwas hindurchbewegt werden muss. Nein, Ausgangspunkt ist die Notwendigkeit, weniger präzise genau dasjenige zu suchen, was man mit einem Teilchen vergleichen kann. Denn sonst steckt in" },
            { src: 'Das Prinzip der zeitlosen Verursachung-053.jpg', alt: "der gegebenen Antwort schon die Frage. Man darf nie im Leben von Atomen sprechen, wenn die Kiste dort in Betrieb geht. Überall lauern gedankliche Fallstricke. Die Unfallgefahr ist gleichfalls bestechend riesig. Ein Teppich an gefährlichen, spit-zen, umherliegenden Utensilien, Schrauben, Muttern, Kohle-staub, Schlüssel für die ungewöhnlichsten Schraubenköpfe la-gen auf dem Boden. Wer sollte diese auch wegräumen? Die Zeit verging stets unbehaglich wirr, beängstigend stöckelnd, bisweilen unbemerkt fließend. Die temporär gespürten Abläufe kreisen manchmal, wie ein Strudel einer sich ständig wiederho-lenden Melodie, irgendwo im Hinterkopf herum. Woher diese Störungen plötzlich ihre Wirkung entfalteten konnten, war beim besten Willen nur unzureichend ermittelbar.Meine Aufmerksamkeit kann nicht stets auf alle ungewöhn-lichen Vorkommnisse ausgerichtet werden. So ist mir während der Vorbereitung des Anheizens meines Ofens, ein absolut un-erklärliches Rätsel untergekommen. So ein Ofen im Keller hat ein paar Besonderheiten für den Dauerbetrieb bereitgelegt, um mit Besessenheit ständig Schwierigkeiten herbei zu zaubern. Man kann nicht ununter-brochen mit Schaufeln beschäftigt sein, wie auch die Asche mit viel Mühe dauernd entfernt werden sollte. Daher bemühte ich ein paar kleinere Maschinen mit den notwendigen Tätigkeiten. Diese Aufgaben wurden durch eine, speziell dafür gebaute, Dampfmaschine erledigt. Dieses dampfende Verschleißteil be-saß einen Regler-Mechanismus, der unzweckmäßiger Weise regelmäßig geölt werden musste. Die Ölkanne war aus einem blöden Grund einfach mal verschwunden. Daher suchte ich wie wild nach diesem Teil. Sogar unter meinem Schreibtisch fand ich nur ein Fass mit Öl. Die Gießkanne blieb bleibend unauf-findbar. In meiner Verzweiflung zog ich sogar an den Schubla-den meines" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
