            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Das Prinzip der zeitlosen Verursachung-066.jpg', alt: "Albtraum mit AtomenWie meine Gefühle ständig einer unbehaglichen Entwicklung durch meinen Seelendruck ausgesetzt sind, muss ich leider fortgesetzt wieder an meinen nächtlichen Albträumen erkennen. Sie sind ein großer Teil meiner doch sehr qualvollen Leidenschaft. Eine Deutung dieser Bilder, Geschichten oder manchmal auch wirklicher Schmerzen, ist außerordentlich problematisch. Die Gegenstände werden dauerhaft unreal chaotisch erzeugt. Unwirklich sind die Gebilde meiner Fantasie vor meinem inneren Auge gezeichnet. Dennoch beherbergen sie manchmal auch hilfreiche neue Ideen. Mein Geist ist subjektive Welle, er sieht aber unermessliche vielfältige mechanische Natur im weiten Umkreis seiner Umgebung. Daher kann auch meine Klugheit nichts anderes denken. Mein ertasteter Körper bewegt etwas Steifes, mit den Augen sichtbares, unbarmherzig durchgehend im Fluss einer hilflosen Maschine an Knochen, was nicht an das rettende Ufer der Erkenntnis bewegt werden kann. Die Umgebung wird unreal gespiegelt, die im Spiegel erkannten reflektierenden Getriebeteile bleiben nur Motor. Ohne wahrnehmbaren" },
            { src: 'Das Prinzip der zeitlosen Verursachung-067.jpg', alt: "Grund der Bewegung, schreitet eine Ansammlung von Geräten durch die Welt ihrer eigenen Blicke. Nichts kann diese Bewe-gung in der Zeit stoppen. Zweifel, Furcht, unbehagliche Expe-rimente einer einsamen Kreatur tauchen aus dem Nichts auf, verschwinden wieder, hinterlassen einen Hauch von Angst. Warum ist dieses Wesen hier? Die Ursache von Zeit, die Ursa-che einer schrittweise angetriebenen Seele, ist fern jeglicher Sicht der Sinne. Die Sinne sind selbst als Vehikel nur ange-bracht, sie erkennen genau dasjenige, was den Geist zur Erken-nung erst möglich macht. Das Unbekannte baut und baut, es steuert etwas an, es fühlt sein eigenes Selbst. Wo ist die Seele eingebettet, kann sie lokalisiert werden, ist sie nur ein Wellen-schlag innerhalb der Möglichkeiten der Natur dort draußen sich selbst wahrzunehmen, sich selbst staunend macht? Wieso kann es etwas fragen? Die Frage ist eine Falle. Dort lauern bereits alle Antworten tief in den Worten, innerhalb des Satzes, innerhalb der Idee überhaupt etwas zu formulieren. Ein Knäuel an unfassbaren, noch nicht gesehenen, niemals auflösenden Fragen an mich selbst. Mein Herz pumpt das Blut in die Adern, sodann in die Organe. Sie sind derweil nur bezeichnet, da die Augen sie se-hen. Sie bedienen ihre eigene Funktion selbst, sie arbeiten ohne Unterlass, sie sind Bedingung und Ursache zugleich. Ohne sie ist kein Leben spürbar. Sie tragen eine Aufgabe, erfüllen diese mit wunderbarer Präzession, bedingungslos gehorchend. Der-jenige, der sie in Funktion erblickt, ist keinen Moment Grund jener vorhandenen Dinge. Der Mensch glaubt sein Dasein als wichtig, glaubt an" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
