            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Rattara_148x210cm-073.jpg', alt: "Der geschwätzige MannAm Mittwochmorgen wartete ich schon sehr früh am Springbrunnen auf dem Alten Markt. Mein Schlaf ge-staltete sich ausgesprochen unruhig, aber ohne die unnötigen Träume. Verschlafen sollte man ausgerechnet heute allerdings nicht, daher bewirkte mein ständiger Blick zum Wecker nur mehr Aufregung und nervöse Unruhe. Das Wetter war ange-nehm regenfrei. Ein paar Wolken hier und da huschten am Himmel schnell vorüber. Mir war durch meine Aufregung kaum bewusst, wie flink meine Beine mich zu dem Markt brachten. Natürlich standen dort schon einige andere Straßen-musiker mit diversen Instrumenten herum. Der Markt war so groß, dass er" },
            { src: 'Rattara_148x210cm-074.jpg', alt: "wohl an jeder Ecke einen Musikmacher Platz bieten könnte, ohne dass sie sich gegenseitig akustisch stören würden. Allein ein zusätzlicher Verstärker wäre hier ein Problem für alle. Mein Tatendrang wurde abrupt durch eine kleine Begeben-heit eiskalt unterbrochen. Ein etwas untersetzter älterer Herr mit Gehstock kam urplötzlich aus einer mir gerade kaum sicht-baren Ecke daher, grüßte knapp mit einer Geste, schaute mich unvermittelt spontan an, setzte sich gleich neben mich auf die Holzbank. Er hatte relativ große Kopfhörer auf. Die Musik aus den Ohrmuscheln war so laut, dass man alles mithören konnte. Die Musik, die man vernahm war alt, primitiv, sehr unsauber in den höheren Frequenzen. Der alte Herr sah mich zögerlich an. Die Augen hatten kleine Pupillen, große Augenbraune, die Iris schimmerte scheinbar schwach grün mit frischen Farben. Eine Brille trug er nicht. Während seines in sich Gehens, summten seine Lippen die dor-tige Melodie leise mit. Warum auch nicht, Menschen habe An-gewohnheiten, für sie angenehme Lieder im Stillen mitzusin-gen. Das soll die Stimmung verbessern und vielleicht auch glücklicher machen. Dabei werden automatisch irgendwelche Hormone im Körper ausgeschüttet, die den jeweiligen Ge-mütszustand verbessern könnten. Bei mir gibt es solche auto-matischen Prozesse natürlich weniger, wie auch, mitsingen während einer Vorstellung ist kaum vorstellbar. Da er bemerk-te, dass ich seinen überlauten Klängen folgte, nahm er die Kopfhörer vom Kopf herunter und sprach mich leise an.„Hallo, junger Mann, entschuldigen Sie den etwas aufdring-lichen Klang aus meinen Kopflautsprechern. Ich bin etwas schwerhörig, insbesondere bei den hohen Frequenzen und dre-he daher den Verstärker bei mir in der Hosentasche etwas mehr auf. Besonders, wenn ich der Meinung bin, unbeobachtet zu sein," }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
