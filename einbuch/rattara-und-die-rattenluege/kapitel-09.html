<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Rattara_148x210cm-085.jpg', alt: "Die ungewöhnliche Geigerin Da stand nun endlich mein Problem vor mir. Diese, mich anziehende Frau, stand allein vor dem Brun-nen, versprühte ihre Musik in die nur zaghaft vorhandene Menschenmenge. Es waren nur wenige Zuhörer zu sehen, wenn diese denn auch wirklich überhaupt wahrhaftig zugehört hätten. Einige Passanten unterhielten sich, eine Dame sprach in ihr Handy, eine andere kramte in ihrer Tasche herum und der Rest ging schnurstracks am Brunnen vorbei. Die Geigerin war daher als Person ständig allein, auch allein mit ihrer Musik. Einen Hut oder einen Behälter für Geld konnte man bei ihr nicht erkennen. Wenn man nur übt, so wie sie mir das mitge-teilt hatte, braucht man solche Utensilien auch nicht im Ge-ringsten. Warum sie ausgerechnet in dieser Öffentlichkeit ihr Spiel trainiert, wäre noch abzuklären. Auf jeden Fall war es meine Absicht, ihr dennoch meine überaus volle Aufmerksam-keit zu schenken. Schließlich übe ich die meiste Zeit ebenfalls mit und auf meiner Geige." },
            { src: 'Rattara_148x210cm-086.jpg', alt: "Es gibt zu viele Zufälle, die das Leben eines Menschen ein-dringlich beherrschen. Immer meint derjenige, dass er dennoch immer noch alles unter Kontrolle hat. Welch Irrtum hier am Werken ist. Nichts ist unter Kontrolle. Der Geist schiebt die Probleme seines Seins nur vor sich her. Sie werden einfach ver-bannt aus dem Bewusstsein. Sie, die Probleme, kommen immer und immer wieder. Kein Mensch kann sich davor retten. Meine Liebe zur Musik, mein Talent, meine Erfahrungen, alles treibt mich unbewusst an das Ufer des stillen Zwanges. Man weiß dies nur sehr lange auch nur ausgesprochen mangelhaft. Das Unterbewusstsein hat einen eigenen festen Griff. Man ist bereits Sklave einer unbegrenzten, geheimnisvollen Macht. Diese Macht kommt bei mir von der Geige oder der Geigenmusik. Man hat nur eine geringe Chance. Das Entkommen ist im Hirn nirgends vorprogrammiert. Das ist alles so absurd, so unglaub-lich, so befremdend, so qualvoll, so endgültig. Das ist komisch nebelhaft, lustig beängstigend, traurig und entsetzlich, alles zugleich. Das Leben ist jedem Musiker nur möglich, indem er instinktiv an dem Instrument seiner Träume glaubt. Der Traum, den jeder seit seiner Kindheit träumt. Er ist fest in seiner Hirn-verdrahtung der Nerven implementiert. Man kann den Zwang nicht sehen, nur spüren. Mein Geist ist bereits schon immer ein Phantom der zukünftigen Ereignisse gewesen. Die Zukunft begann bereits in der Vergangenheit dennoch allgegenwärtig. Musik als Mittel zur Versklavung. Ein Gespenst der Natur für den Menschen geschaffen. Meine Geige ist für mich der Gott, der alles schafft, alles will, alles erdenkt, alles macht. Während mir solche Gedanken kamen, spielte die Frau ihre Musikstücke. Die Töne drangen in meinen Kopf. Sie erzeugten mir durchaus bekannte Klangmuster, Melodien aus vergange-nen Kindheitstagen, Harmonien der unbändigen Verwirrungen der verschiedenen Komponisten. Das Spiel dieses" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
