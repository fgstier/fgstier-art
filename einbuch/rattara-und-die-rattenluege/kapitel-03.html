<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Rattara_148x210cm-024.jpg', alt: "Der Weg zum VirtuosenAlles fing damit an, dass ich mit 7 Jahren eine sogenannte ¼ – Violine zu Weihnachten geschenkt bekam. Für mich war dieser Moment das größte leidenschaftliche Geschenk meines Lebens. Mein Herz sprang mir regelrecht um die Oh-ren. Das war das ultimative geilste, super perfekte, Geschenk. Wie nimmt ein Kind dieses neue Erlebnis wirklich wahr? Da geht es wohl kaum um die wissenschaftliche Erklärung eines Musikinstrumentes. Das Ding ist ein Experiment. Etwas gewal-tig Fremdes und Unfassbares kommt in die Welt eines kleinen unerfahrenen Kopfes. Ein Wunder tut sich hier auf. Die Musik wird plötzlich fassbar, greifbar, ertastbar, wie ein geschnitzter Stock sichtbar. Das ist ein Abenteuer, welches einem Kind nur wenig" },
            { src: 'Rattara_148x210cm-025.jpg', alt: "vorbereitend durch Erwachsene aufbereitet wird. Das Erlebnis einer inneren Begeisterung steckt in der Tatsache selbst, nicht in aufbereiteten Bildern eines Filmes. Das Herz ist mit eigenem Antrieb der Motor der Entdeckung jeglicher unbekannten Räumlichkeiten der Fantasie. Unbeschreibliche Freude breitet sich im Kopf des Kindes aus. Er wird diesen Augenblick sein ganzes Leben lang als Ausgangspunkt seines Strebens behal-ten. Wenn schon unmöglich bewusst, so doch tief im inneren seiner Seele.Mein erstes Instrument war etwa ein halbes Dutzend Zenti-meter kürzer als eine normale Geige. Klar, dass diese Länge für meine Finger sowie entsprechend für meine Armlänge ein gu-ter Anfang war. Man konnte nun mehrere Jahre auf ihr üben. Die Grundlagen sind wirklich sehr schwierig zu erlernen. An-fangs geht das Meiste der Handfertigkeiten schrecklich quälend unschön von der Hand. Die Finger schmerzen, der Arm schläft ein, der ganze Körper ist verdreht, die Fingerkuppen brennen, hervorgerufen durch die scharfen Saiten. Die tiefen Rillen in der Haut verschwinden erst, wenn sich auf den Fingerspitzen Hornhaut gebildet hat. Diese ist zunächst schuppig, später re-gelrecht rund, die harte Hautverdickung versteckt recht wirk-sam sämtliche Fingerabdrücke.Die Muskulatur der Finger ist unnatürlich beansprucht, ins-besondere der kleine Finger kann sich sehr lange nur stochernd auf den Saiten bewegen. Gerade dieser Finger will nur mit Ge-walt den zu lernenden Bewegungen folgen, da er bisher den geringsten Muskelanspannungen ausgesetzt war. Es ist die Zeit, die darüber entscheidet, ob der Körper dem Kopf nach-gibt. Viele Jahre lang kann zusätzlich kein schöner, angenehm klingender, Ton erzeugt werden. Alles klingt nach Katzenge-jammer oder Türenquietschen. Die Ohren werden arg strapa-ziert, die Nerven der Eltern ebenso. Die meisten jungen Leute geben nach einigen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
