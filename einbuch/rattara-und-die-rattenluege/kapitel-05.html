<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Rattara_148x210cm-048.jpg', alt: "Die TraumdeutungenMein Leben definierte sich bisher durch üben, lernen, dann wieder üben. Die Welt, die mir bisher bekannt war und sie auch so wollte, bestand aus den Notenheften, aus der Vergangenheit der Komponisten, aus den Anforderungen der Prüfungen, dem angehäuften Wissen über Stimmung, Gehör-bildung, Kompositionslehre, Blatt-Spiel, und tausend anderen Sachen, die auf der Hochschule gelehrt werden. Mein Herz schlägt für meine Violine, meine Saiten, meine Finger. Was um aller Willen ist innerhalb einiger Minuten geschehen? Mein Gehirn hat sich verkrampft, wurde umgekrempelt, das Blut hat plötzlich scheinbar eine andere Blutgruppe bekommen. Meine Gene sind förmlich durchgeknetet worden. Die Klangvielfalt hat mein Nervengeflecht angezapft. Das Innere ist wie Bier nach außen" },
            { src: 'Rattara_148x210cm-049.jpg', alt: "geflossen. Was ist nun hineingekommen? Ein neuer Wille, ein neues Bewusstsein?Es war mein fester Wille mit dieser Geigerin Kontakt aufzu-nehmen. Mein Leben wurde erstmalig zur psychischen Qual. Noch nie hatte man im Internet irgendwas an derartigen Dingen gelesen. Dort gab es nichts, was man für das Geigenspiel nicht schon wusste, dort konnte man keine brauchbaren Zusatzin-formationen dafür bekommen. Alles Wichtige wurde durch meine Lehrer bisher reichlich angeboten. Das hatte sich nun wie ein lauter Donnerschlag geändert. In der Bibliothek konnte man sogar etwas über die Lebensweise der Ratten erfahren. Liebha-ber gab es ebenso viele, wie auch die Rattenverächter. Meine Erfahrungen mit diesen Tieren waren eher bescheiden. Wie man diese Viecher mit dem Musiker in Verbindung bringen könnte, blieb im Dunkeln. Es wäre möglich, dass ein Haustier eine gewisse Behaglichkeit für den Halter bedeutet. Dann könnte man sich eine kleine Stimulanz für das Musizieren vor-stellen, allerdings sehr vage und vorsichtig. Das Tier war ja auch in keinem Käfig untergebracht. Oh je, das fiel mir erst sehr spät ein. Diese Tatsache war gänzlich untergegangen durch die verrückten Verwicklungen im Kopf. Wie kann eine Ratte, auch wenn es als Haustier gehalten wurde, so friedlich auf dem fremden Plattenspieler sitzen? Geht das überhaupt? Verdammt! Heut ist erst Wochenende, bis Mittwoch ist noch eine Ewigkeit. Wie sollte man sich bis dahin ablenken? Sich weiter mit den Ratten zu beschäftigen, hatte wenig Sinn. Meine Vermutungen könnten sich als Quatsch herausstellen. Mich dann mit Ratten-wissen voll zu stopfen hätte daher kaum eine Change etwas zu erreichen. Es gibt keinen Zusammenhang zwischen Musik und Ratte, den man verfolgen könnte. Aus der Not heraus versuchte ich mich mit Kommilitonen über das Problem der Gefühlslage beim Spielen, der Anschaffung von Haustieren bis zu der Hal-tung von Ratten, zu unterhalten. Leider" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
