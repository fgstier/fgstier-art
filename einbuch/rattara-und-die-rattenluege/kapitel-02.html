<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 3</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>

            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>

    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'Rattara_148x210cm-018.jpg', alt: "Die nackten SpekulationenNatürlich hat man sich in der Vergangenheit schon Gedanken darüber gemacht, welche Ursachen im Einzelfall zu ermitteln gewesen sein könnten. Es ist hierbei zu berücksichti-gen, dass eine Vielzahl an Möglichkeiten existieren, wie sich die Musiker ein Leiden hätten zuziehen können. In den hier vorliegenden Fällen geht es allerdings um Todesfälle. Ein krankhafter Schulterhochstand oder das HWS-Syndrom sind sicherlich schmerzhaft, dennoch nicht so gravierend wie eine eventuelle Vergiftung durch den Lack oder der Farbe am Holz zum Beispiel. Eine Arthrose, das häufig auftretende Karpal-tunnelsyndrom, ebenso das erst viel später öffentlich bekannt gewordene Rotatoren-Manschetten-Syndrom sind relativ selten. Eine unspezifische Sehnenscheidenentzündung, diverse Ner-venkompressionssyndrome" },
            { src: 'Rattara_148x210cm-019.jpg', alt: "Rotatoren-Manschetten-Syndrom sind relativ selten. Eine unspezifische Sehnenscheidenentzündung, diverse Nervenkompressionssyndrome sind im Gespräch gewesen, die aber nur zeitweise auftreten. Die tödlich verunglückten Musiker waren auch weniger erkrankt an Kontaktekzemen bzw. an einer Dermatose. Am weitesten waren die Vermutungen als auch diverse Diskussionen bezüglich Lärmschwerhörigkeit im Orchestergraben oder Tinnitus-Probleme fortgeführt worden. Dies konnte aber nur verursacht worden sein, wenn die verunglückten Musiker auch viele Jahre diese Orchestertätigkeiten ausgeübt hätten. In einem solchen Fall, wäre es denkbar, dass die Arbeit zu einem übergroßen psychischen Druck ausarten und die Musiker zu Selbstmordgedanken hinreißen lassen hätte können. Wie wohl jedermann bemerkt haben sollte, ist niemand auch nur annähernd von einer Brücke gesprungen. Natürlich lag es auch nahe, geheim gehaltene Probleme in der Hand oder am Arm zu vermuten. Insbesondere ein schnellender Finger kann schnell die Existenz eines Musikers zerstören. Des Weiteren gab es die Unterscheidung bezüglich von 1. Und 2. Violine im Orchester nicht. Alle waren hervorragende Solisten, insbesondere teils viele Jahre auf der Bühne geübt. Ein gewisser M. Dasturnz hatte sogar 1958 die Vermutung geäußert, dass man im neurologischen Sinne auch bei Überlastungsproblemen durch das Repertoire von Mozart und Rossini an seine Grenze geraten könnte. Wichtig für eine Einschätzung der Gefährlichkeit des" },
            { src: 'Rattara_148x210cm-020.jpg', alt: "Geigen-Spiel ist die Tatsache, dass es durch die Verwendung von Nickel in den verschiedenen Materialien zu sichtbaren ferner wahrscheinlich auch unsichtbaren Vergiftungserscheinungen, zumindest aber zu allergischen Reaktionen kommen kann. Eine Nickelallergie führt zu entzündlichen Ekzemen an Fingern und Händen. Ursache können die Saiten aber auch die Kinnstütze sein. Den Geigerfleck kennt man hinreichend. Er ist ein Zeichen für die Empfindlichkeit der Hals – und Kinnbereiche. Die häufigsten relevanten Allergene, die für Musiker hier wichtig sind, kommen vermutlich hauptsächlich von den Metallen, dem Kolofonium einschließlich den Farbstoffbestandteilen.Wie man es auch dreht oder wendet. Leider waren in der Vergangenheit kaum Nachweismethoden vorhanden, um die eine oder andere Vergiftung zu ermitteln, wenn es denn wirklich eine gewesen ist! Dieser Umstand ließ die tödlichen Begebenheiten in Vergessenheit geraten. Zumindest blieben Einzelfälle in den Überlieferungen aus den verschiedensten Quellen erhalten, die nie offiziell überzeugend in einen gemeinsamen Zusammenhang gebracht worden sind. Aus diesem geschichtlichen Vermächtnis wurden nur zwei wesentliche Erkenntnisse herausgearbeitet. Die erste besagt nur, dass sich die Beschwerden der Geiger auf die Bereiche des Bewegungsapparates beschränken, welches" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
