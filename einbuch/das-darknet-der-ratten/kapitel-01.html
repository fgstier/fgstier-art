<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-01.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 4</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'doc das darknet der Ratten-008.jpg', alt: "Der verdachtsschwangere Raum, in dem heute jeder Text sofort darauf abge-klopft wird, ob er synthetisch erzeugt wurde, erzeugt eine ganz eigene Form von Entfremdung. Sobald dieser Verdacht im Raum steht, verflacht die Bereit-schaft des Lesers, sich auf die Tiefe einer Metapher einzulassen. Die Worte verlieren ihren Widerstand, weil man glaubt, sie seien per Algorithmus mühe-los in den Raum kopiert worden. Das droht die Magie jeder echten Konstrukti-on zu töten.Dass ein Autor diese Entfremdung spürt – dieses drohende Untergehen im synthetischen Frequenz-Rauschen –, ist die logische Konsequenz für jeman-den, der die Mechanismen hinter den Kulissen durchschaut. Doch die Antwort der Welt darauf ist nicht nur düster: Sie sucht das Echte. Wenn Menschen zu-sammenkommen, um gemeinsam K-Pop-Choreografien zu tanzen, suchen sie genau das, was der Text im Netz verliert – echte analoge Resonanz, kollektive Energie und eine greifbare Gemeinschaft im Hier und Jetzt. Es ist der Versuch, der digitalen Entfremdung durch reale Bewegung und Verbundenheit zu ent-kommen.Während das Buch also die verstaubten Vokabeln der Existenz und den Code der Kausalität dekonstruiert, bleibt die Sehnsucht nach echter Wirkung bestehen. Ich, ein Autor, bin nicht hier, um die Welt zu verachten – sondern um das Sinnbild einer Hoffnung zu sein, die wieder den Unterschied zwischen bloßer Hülle und echter Leidenschaft sucht. WARNUNG:Dieser Sektor wurde von den Kohärenz-Kuratoren wegen kri-tischer Frequenzen gedämpft]. Auf dieser Seite ist nichts mehr." },
            { src: 'doc das darknet der Ratten-009.jpg', alt: "STATUS: SPERR-ZONE // ZUGRIFF VERWEIGERTQUELLE: DARKNET DER RATTEN (SEKTOR ELB-STILLE)SICHERHEITSEINSTUFUNG: KOSTENSCHUTZ-DEKRET / STUFE IV=======================================================WARNUNG AN DEN NUTZER:Die Seiten 01 bis 20 dieser Dokumentation wurden von den System-Kuratoren vorsätzlich aus dem freien Datenstrom des &quot;Darknets der Ratten&quot; verbannt und versiegelt. ZWECK:Verhinderung unautorisierter, kostenfreier Extraktion von Substanz-Fragmenten (Aktiv-Prävention gegen Phrasen-Diebstahl). BEFUND:Die verbleibenden Fragmente dieser Leseprobe begin-nen weiter hinten auf Seite 19. Sie sind unvollständig, hochfrequent und eignen sich NICHT zur oberflächlichen Beruhigung. Der Versuch, die fehlenden Seiten durch Rekonstruktion der Zeitformen zu überbrücken, erfolgt auf eigene Gefahr für das neurale Netzwerk des Lesers." },
            { src: 'doc das darknet der Ratten-010.jpg', alt: "" },
            { src: 'doc das darknet der Ratten-011.jpg', alt: "" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
