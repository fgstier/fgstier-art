<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-11.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
    <link rel="preload" as="image" href="/wappen.jpg">
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'doc das darknet der Ratten-115.jpg', alt: "Der synthetische CodeWir waren nun endlich auf dem Weg. Wohin es gehen sollte, konnte meine Fantasie nicht im Geringsten erahnen. Meine Partne-rin ließ keinen Zweifel daran übrig, mich nicht abrupt oder auch nur irgendwie sacht an diese mir unglaubwürdige Situation zu geleiten. Selbstsicher erzählte sie mir Dinge aus ihrer Erlebnis-welt, die mir zwar durchaus geläufig sein dürften, aber in einer Sichtweise interpretiert wurden, die nun beispielhaft meine Gren-zen des Verstandes überflogen. Die Formulierungen ihrer Sätze kann ich daher nur sehr oberflächlich wiedergeben. Meine Gedan-ken stürzten während ihrer Geschichte stolperartig einige Sätze hinterher. Nicht, dass sie schnell erzählte, nein, ganz im Gegenteil. Die Art der bildlichen Gestaltung machte mir Probleme, ihren ge-danklichen Sprüngen zu folgen.Während wir also zu unserem Ziel liefen, erfuhr ich Dinge, die mir wie aus dem Bilderbuch eines Märchens erschienen. Vor ih-rem Besuch der Hochschule, hatte sie Kontakt zu sehr verschlos-senen technischen Studenten aus der Uni für Kybernetik. Diese Einrichtung befindet sich noch immer ebenfalls hier im Ort. Dort werden immer noch sehr kuriose Experimente veranstaltet. So hat man innerhalb eines Gebäudes mehrere Tiergehege mit Schwei-nen und Hühnern angelegt. Diese Gesellen sind nicht voneinander getrennt," },
            { src: 'doc das darknet der Ratten-116.jpg', alt: "laufen daher wild durcheinander. Während die Schweine sich grunzend im Schlamm wälzend erfreuten, gackerten die Hühner stolzierend umher und pickten ständig nach Fressen. Unregelmä-ßig kam ein Student vorbei, um aus den umher stehenden Senso-ren diverse Messwerte abzulesen. Welchen Zweck diese Arbeiten verfolgten, war ihr nicht so bewusst. Nun kam sie langsam zurück zu ihrem Problem, dessen Lösung sie zwangsweise zu den Tieren hier führte. „Was sollte man tun, zu wem müsste man gehen, um eine inne-re Sehnsucht zu stillen, die man verloren hatte? Meine Fragen brachten mich vor einigen Jahren in den hier angrenzenden Park und suchte wie so oft schon ein Plätzchen zum Verweilen. Schaute dabei in den Himmel, meine Gedanken verschmolzen mit seiner tiefen unwirklichen, kaum greifbaren Sehnsucht, irgendwie wie-der einen inneren Frieden zu finden. Der blaue Himmel wurde durch viele grüne Blätter zerstückelt. Die Äste knarrten im leisen Lüftchen. Die Blätter hatten keine Probleme. Sie wachsen, bis sie abgestoßen werden. Keine Fragen, keine Ziele. Die Blumen hier in der Erde sehen wunderschön aus. Sie bedauern nicht, dass ihre Schönheit nicht beachtet wird. Nur ein paar Blicke entfernt stehen sie von den vorbeilaufenden Menschen. Die Körper könnten sich beinahe berühren. Keiner da, der mit ihnen spricht, der sie anfühlt und bewundert. Ich befand mich unablässig in einer Zwickmühle der Gefühle. Die Musik schien mir abhandengekommen. Nicht so sehr die Tö-ne oder die Klänge.Nein, es musste mein Herz sein, welches die Musik kaum mehr empfinden konnte. Alles befand sich nur noch in Funktion." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
