<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'doc das darknet der Ratten-019.jpg', alt: "Kaum, dass er sich bewegen kann. Seine Glieder sind steif, die Haut ist fast taub, zu Eis erstarrt. Das Blut ist durchgekocht, so als wäre es nie in seinen geschmeidigen Adern mühelos geflossen. Beide Augen sehen die Umgebung nicht mehr. Der Blick ist fest, starr, unbeweglich, verkrampft, eisern fest gekettet an dieser ge-liebten, unendlich verhassten und doch auch wundersamen Gei-ge. Sie liegt unweit, dennoch unerreichbar vor ihm. Er kann sie in keiner Weise mehr heben. Seine Kräfte haben sich in der Musik hoffnungslos verfangen, sind verloren. Diese Geige hat ihm das letzte Stück Leben aus dem ganzen Körper gesogen. Sie gleicht einer Schlange, die sich um ihr Opfer windet, es mit Haut und Haaren verschlingt. Gnadenlos straft sie jeden, der versucht, ohne ganz besonderes Talent, auf ihr zu spielen. Wer talentiert ist, ent-scheidet einzig und allein ihr Holz, ihr Steg, die schwingenden Saiten auf ihr, die vibrierende Luft im Schallloch und der zitternde Boden am Hals des Spielers. Das Holz kriecht in die Adern, klammert sich an die Blutgefäße, durchdringt jegliche Zelle. Es erobert die Gewalt über den Willen, sogar das Herz hat keine Chance, sich der wurmartigen Gewalt zu entziehen. Gregor wird nie mehr die Kunst erlernen dürfen, genau den Ton zu treffen, dessen Klang er benötigt, um weiterzuleben. Er kann es nimmer-mehr. Sein Hirn ist leer gewischt durch die vielen" },
            { src: 'doc das darknet der Ratten-020.jpg', alt: "schrägen, falschen Töne. Keine andere Geige hat sich so gewehrt, ihm meisterlich zu dienen. Dieses unbarmherzige Stück Holz hier ist unbrauchbar unterwürfig oder gierig gelehrig. Sie wehrt sich mit allen Spänen, Ästen nebst Fugen. Wie ein rostiges Schiff unfä-hig ist, zu schwimmen, kann sich das Holz dieser Geige nicht ge-schmeidig an die Finger schmiegen. Die Musik wirkt krächzend, hohl, sogar lieblos hinterhältig lachend. Sein Herz ist unermüdlich schlagend, immer noch bereit für den letzten Aufschrei seiner Wil-lenskraft. Es drückt das dicke träge Blut in die Adern hinein. Es pumpt immer noch Energie in seinen Kopf. Dort sprudeln die Gedanken um Noten, Töne, Harmonien sowie eindringliche Me-lodien. Wie lange noch, wird er es ertragen müssen, unfähig zu sein, sein geliebtes Instrument zu spielen.Das Muskulöse Spielen allein reicht nur bis zum Tellerrand der Kunst. Die Geige selbst muss mit jeder Faser spüren, geliebt zu werden, sie wird dann selbst die Musik erklingen lassen. Er weiß es, hatte es vor vielen Jahren ein einziges Mal erlebt. Der kurze Geigenklang blieb das Schönste, was er je gehört hatte. Sein Den-ken wurde damals beschleunigt. Seine Gefühle kochten unbändig, wild rasend aus seinem Körper entfliehend. Nie wieder hatte er diese starken Emotionen gespürt.Ein Gewitter hat ihn damals vom weiteren Spiel unterbrochen. Er hat immer noch keine Ahnung, dass gerade dieses Unwetter sein Leben vorerst gerettet hatte. Diese Geige hat ihm nicht das Glück beschert, dauerhaft vollkommen Klang zu werden. Lang-sam schwindet ihm jegliche Hoffnung, jegliche Zuversicht. Das Letzte, was er sah, war ein lachendes, schallendes, unbarmherzig liegendes Stück Holz. Er befand sich bereits kurz vor dem Ende, wie schon einige Musiker vor ihm. Diese Geige tötet jeden, der sich nur ungenügend würdig erweist, die Töne ungezwungen, zugleich fliegend leicht, hervorzuzaubern. Dazu muss man diese Geige in einer besonderen Weise lieben. Sie diktiert unbarmherzig selbstsüchtig, wie sie geliebt und bespielt werden will. Sie hat es schon immer so getan." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
