<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>kapitel-02.html // Sektor-Archiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050508; color: #00ffcc; margin: 0; overflow: hidden; font-family: monospace; }
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }
        #bg-slot { z-index: -1; }
        .video-frame {
            border: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            background: #09090f;
            position: relative;
        }
        #chapterPage {
            transition: clip-path 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            clip-path: inset(0 0 0 0);
        }
        .transition-wipe {
            clip-path: inset(100% 0 0 0) !important;
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 2</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button id="btnPrev" onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// ZURÜCK</button>
            <button id="btnNext" onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)] disabled:opacity-30 disabled:pointer-events-none">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
const pageFiles = [
            { src: 'amazon segel im Nichts-032.jpg', alt: "Die Kunst des Flusses So langsam kam meine Stimmung in Wallung, um mir die so geliebten Wasserspiele auf der Donau anzuschauen. Der Fluss ist ein Kunstwerk, so wie die meisten mir bekannten Naturschauspiele. Das Schauspiel ist auf einer Bühne, welche man nicht sehen kann. Diese ist dreidimensional ausgebreitet, im Kopf fest verdrahtet. Das Schauspiel nun spielt sich dort verborgen im Netzwerk der zeitlichen Wasserstromverzweigungen ab. Die Inspiration im Inneren kommt von da draußen. Ein Ort an den ich hinzeigen kann. Doch liegt er wirklich da, wo meine Augen vernehmlich hinblicken?Die Kunst des Flusses besteht für meine Gefühle und Gedanken darin, im Spiel der Wellen zu versinken. Sie kommen, gehen, versuchen sich zu wiederholen, springen zu" },
            { src: 'amazon segel im Nichts-033.jpg', alt: "verschiedenen zeitlichen Ereignissen. Sie sind wie die Wellen an der Oberfläche des Flusses. Ich verstehe diese Inhalte auf meine Weise. Das Denken hingegen spielt sich nur im Lauf der Buchstaben ab. Die Anordnung der Zeichen macht den Sinn. Nicht die Zeichen selber haben Struktur. Daher können die Wellen selbst auch keine Bedeutung haben. Was einen Sinn besitzt, ist die wechselnde, sich immer wieder aufschaukelnde Beziehung der Wellenberge. Die Täler der Wellen sind nur die logische Konsequenz der Angleichung an die Menge. Da wo etwas ist, ist dann woanders weniger davon. Die Wellenstruktur auf der Oberfläche schwimmt dahin. Die Änderungen markieren die Zeitschritte. Die Zeit wird zunächst beobachtet. Sie ist nur eine Feststellung von der sich ändernden bildlichen, für mich chaotischen, Wellenanordnungen. Die Ordnung ist entweder so oder so. Was dabei Ordnung ist, dass bestimmt mein Instinkt. Ebenso gut könnte das glatte Wasser eine perfekte Ordnung sein. Da ist alles in Ruhe, keine Bewegung, also auch keine Zeit? Die Zeit ist wohl doch nicht als Bewegung zu erkennen. Wenn sich nichts bewegt, kein Ton in mein Ohr gelangt, keine Mücke auf meiner Haut sticht, kann ich die Zeit dann spüren? Die Bewegung meiner Gedanken, das Spielen der Wörter, das Zusammensetzen von Sätzen in meinen Kopf, das nicht zu verhindernde Aufblasen von Geschichten aus der Vergangenheit, aus der Phantasie auch, treiben die Zeit voran. Ich bin gleichzeitig der Beobachter dieser in mir aufkommenden Vorgänge und Beobachter des Zeitablaufs. Ich bin mir selbst immer selber beobachtend derselbe. Mein Denken ist abgekoppelt vom Beobachter. Wie kann ich da Neues entdecken? Ich bin gefangen in meinem Rahmen der gelernten Satzstrukturen, Wie viele Gedanken können so gedacht werden? Selbst Sätze können unterschiedliche Informationen" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
            if (btnPrev) btnPrev.disabled = (currentIndex === 0);
            if (btnNext) btnNext.disabled = (currentIndex === pageFiles.length - 1);
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
</html>
