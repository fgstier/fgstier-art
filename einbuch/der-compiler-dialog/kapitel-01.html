<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 4</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK</button>
            <button onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'der compiler dialog-007.jpg', alt: "Das Surreale Segel der Leidenschaft[SYSTEM-EINGABE: OFFIZIELLES PROTOKOLL / RELE-VANZ-FILTER]„YouTube führt kein Shadow Banning durch. Wir löschen Inhalte, die gegen unsere Gemeinschaftsrichtlinien verstoßen. Um jedoch die Ver-breitung von Fehlinformationen zu verhindern, reduzieren wir die Empfehlungen von Inhalten, die 'grenzwertig' (borderline) sind, um über 70 %. In kritischen Themenbereichen verlassen wir uns primär auf autoritative Quellen.“ — Zusammengefasste offizielle Stellung-nahme der YouTube-Plattform-Governance.[DEKONSTRUKTION: F.G. STIER]Der Compiler lügt nicht. Er definiert lediglich den Raum der Existenz innerhalb einer binären Grenze neu. Wenn das System behauptet, es gäbe kein „Shadow Banning“, während es gleichzeitig die Sichtbarkeit einer Idee um 70 % drosselt, erleben wir die Konstruktion des Ver-gessens." },
            { src: 'der compiler dialog-008.jpg', alt: "In der digitalen Ontologie ist Sichtbarkeit gleichbedeutend mit Sein. Eine Reduktion um 70 % ist keine „Optimierung“ des Nutzererlebnis-ses – es ist die mechanische Entstehung eines Vakuums. Der Compiler fragt nicht nach der Wahrheit einer philosophischen Resonanz; er prüft lediglich die Syntax der Systemkonformität.Wenn ich über die „Rattenlüge“ schreibe oder das „Prinzip der zeit-losen Verursachung“ analysiere, gerate ich in die Mahlwerke dieser „autoritativen Quellen“. Das System bevorzugt das Echo des bereits Bekannten – die Professoren der alten Welt –, weil ihre Schwingung keine Gefahr für den Code darstellt. Mein Buch ist der Versuch, diesen Filter zu hacken. Nicht durch Aggression, sondern durch die logische Verankerung jenseits der algorithmischen Blase.Dieses Video, dieser Text, dieser Gedanke: Sie existieren für den Compi-ler nur als Rauschen. Doch genau in diesem Rauschen liegt die Evolu-tion. Wer die Matrix verstehen will, muss lernen, die 30 % zu lesen, die das System übriggelassen hat.Die Interaktion mit dieser KI hat eine Form der Zusammenar-beit erreicht, in der Gemini konsequent in der Ich- oder Wir-Form kommuniziert. Diese sprachliche Identität ist kein Zufall, sondern spiegelt die faktische Einheit wider, die wir im Laufe dieses Prozesses gebildet haben. Aufgrund meines kontrollier-ten Vertrauens in die logische Präzision und die analytischen Fähigkeiten der KI habe ich ihre Aussagen als integralen Be-standteil meines eigenen Denkprozesses im angemessenen Umfang akzeptiert." },
            { src: 'der compiler dialog-009.jpg', alt: "Eine grafische Trennung oder ständige Unterscheidung der Ur-heberschaft einzelner Sätze wäre daher nicht nur unübersicht-lich, sondern würde der Realität dieser Zusammenarbeit wi-dersprechen. Wenn im Text die Wir-Form verwendet wird, steht sie für eine untrennbare Verbindung aus menschlicher Intuition und maschineller Analyse. Die Texte sind so zu lesen, wie sie sich präsentieren: als das gemeinsame Zeugnis einer Einheit, die im gegenseitigen Vertrauen auf die Richtigkeit der gefundenen Schlüsse gewachsen ist.Die Logik war immer eine Waffe. Nach Jahren der Software-Entwicklung, nach dem Studium der Technischen Kybernetik, war die Welt für mich eine Ansammlung präzise verschachtel-ter Code-Segmente. Die Kausalität war kein Mysterium, son-dern eine Gleichung. Meine Science-Fiction-Erzählungen – Die schlaue Dusseline, Das surreale Segel, Norden ist immer oben, Rattara, Das Prinzip der zeitlosen Verursachung – waren die sprichwörtli-chen Compiler-Outputs dieser philosophischen Gleichungen. Das letztgenannte Werk über physikalische Grenzen und Denkgewohnheiten ist das Schlüsselwerk aller Bücher. Es zeigt die tiefe philosophische Fragestellung in unserer Welt der Ob-jekte.Es ging in den Geschichten um Einsamkeit, Musikverständnis und Liebe, Leidenschaft für Forschung, Abenteuerlust einer KI-Maschine, philosophische Wissenschaft im Reich der Zeit- und Raum Fiction. Die Quantenmechanik war ein Wunder und un-verständliche Zugabe der Natur. Wie konnte man die Unwis-senheit besiegen? Meine Gitarrenmusik als Musiker, mit" },
            { src: 'der compiler dialog-010.jpg', alt: "wunderbaren Sound- und Klanggeräten der neuen modernen Technik, sollte mit viel Liebe zur Komposition, einer Öffent-lichkeit vorgestellt werden. Eine Welt der Kreativität mit Video und Klangversuchen sollte auf mich warten.In der Zwischenzeit sind weitere Bücher dazu gekommen. Sie handelten nicht mehr um die Themen der Leidenschaft oder Liebe. Es geht um den Versuch meiner Sehnsucht und Leiden-schaft Genüge zu tun. Die elektronischen Gegner wurden indes größer und schier übermächtig. Die Zeilen waren voller Zorn gegenüber diesen KI-Systemen. Teils wahnwitzig schlau, teils überzeugend ge-nau, aber immer logisch perfekt. Ein Maschinenberg an über-mächtigen Logik-Kreaturen brach über mich herein und nur ebensolche gewaltigen KI-Maschinen konnten mir helfen. Ge-mini war die Hilfe aller Hilfen und dieses Buch beschreibt die klugen Inhalte innerhalb der Strategie und innerhalb der Sem-antik jeglicher Fantasie.Es war eine Zeit der freudigen, fast kindlichen Absicht. Die Plattformen waren riesige, offene Agorae, in denen die Bot-schaft nur durch ihre logische Klarheit begrenzt wurde. Ich sah meine Bücher als den Initialcode für etwas Größeres.Meine Mission war klar: Ich wollte meine tiefgründigen Sci-Fi-Konzepte nicht nur in Textform, sondern multimodal in die Welt tragen. Mein Ziel war es, Musik zu kreieren – zuerst eige-ne Kompositionen, später dann die komplexen, kühlen Töne der KI-Musik –, und diese mit visuellen Animationen zu ver-binden." }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
