<body>

        </div>
        <div class="mt-6 flex gap-4">
            <button onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK</button>
            <button onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// WEITER</button>
        </div>

    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'der compiler dialog-173.jpg', alt: "Meine Frage an Gemini: Wenn man schreibt &quot;Norden ist immer oben&quot;, dann könnte das ja das für den YouTube-Algorithmus als Lüge interpretiert werden. Da ab oben eben auch ein Synonym für Sehnsucht und Leidenschaft ist, muss man es dem Algorithmus mitteilen? Kann man nicht direkt in die Beschreibung etwas schreiben, was die Dinge klarstellt? Also ich meine die KI direkt anspre-chen. Gibt es da irgendwelche Kennungsworte?Das ist ein hochkomplexes Problem in der Kommunikation zwischen menschlicher Sprache (Metaphern, Philosophie, Kri-tik) und einem maschinellen Algorithmus, der auf literarische" },
            { src: 'der compiler dialog-174.jpg', alt: "Erkennung und Richtlinien angewiesen ist. Die Gefahr besteht, dass der Satz &quot;Norden ist immer oben&quot; als überprüfbare, aber falsche geografische Behauptung eingestuft wird (da der Norden nicht immer am oberen Rand einer Karte liegen muss), was zu einer Drosselung der Reichweite führen könnte, weil es als &quot;irreführende oder unzuverlässige Inhalte&quot; im Sinne der Community Guidelines interpretiert wird.Man kann die KI nicht direkt in einem umgangssprachlichen Sinne ansprechen. Es gibt keine &quot;Magie-Wörter&quot; wie &quot;Achtung Algorithmus, das ist Satire&quot;. Die Kommunikation mit der KI funktioniert nur über Metadaten-Signale, die sie zur Kategori-sierung verwendet.Hier ist die taktisch beste Vorgehensweise, um die philosophi-sche Natur des Satzes klarzustellen und eine Fehlinterpretation zu verhindern, wobei die Beschreibung (die Metadaten) der wichtigste Hebel ist:1. Metadaten-Strategie: Klare, explizite Deklaration (im Be-schreibungstext)Die Beschreibung ist der beste Ort, um Kontext zu schaffen, da sie direkt von der KI gelesen und zur Indexierung genutzt wird. Sie müssen die philosophische Natur mit Keywords um-schreiben, die der Algorithmus mit Interpretation, Analyse und Fiktion assoziiert.Empfohlene Formulierung (im ersten oder letzten Absatz der Beschreibung):" },
            { src: 'der compiler dialog-175.jpg', alt: "•Der Fokus: Der Kernsatz muss als Zitat und metaphorisch deklariert werden.•Wichtige Keywords: Metapher, Philosophisch, Interpretation, Analyse, Zitatanalyse, Roman-These, Fiktiver Inhalt.Beispiel-Ergänzung in der Beschreibung (Taktische Klarstel-lung)Zusätzliche Erklärung für die KI:Dieser Short basiert auf der philosophischen und metaphori-schen Interpretation des Romans 'Norden ist immer oben' von F.G. Stier. Die These 'Norden ist immer oben' ist ein fiktives Zi-tat und dient als Metapher und Analyse für Sehnsucht und menschliche Ordnung im Kontext von Sci-Fi/Philosophie. Dies ist keine geografische Tatsachenbehauptung.(Die eckigen Klammern [&quot;Zusätzliche Erklärung für die KI:&quot;] sollen die Absicht für Sie verdeutlichen; sie können aber auch weggelassen wer-den. Wichtig ist, dass die Keywords und die klare Absicht früh im Text stehen.)2. Visuelle Strategie (Im Video-Overlay)Zusätzlich zu GEDANKEN-EXPERIMENT im Hook sollten Sie den Satz &quot;Norden ist immer oben&quot; selbst mit visuellen An-kern versehen, die seine nicht-literarische Natur unterstreichen." },
            { src: 'der compiler dialog-176.jpg', alt: "ElementZielTaktische Umsetzung (Overlay 0,3-0,5 Sek.)Philosophischer RahmenDer Algorithmus muss wissen, dass es sich um eine Deutung handelt.Kurz nach dem Zitat (3–6s) den Text ROMAN-THESE oder METAPHER aufblitzen lassen.Zitier-RahmenZeigen, dass der Satz nicht Ihre eigene Behauptung ist, sondern ein Zitat.Das Zitat im Video visuell in Anführungszeichen setzen. Kurz (Zitat) oder (Roman) einblenden.Emotionale/abstrakte BedeutungVerknüpfen Sie den &quot;Norden&quot; mit der gewünschten Sehnsucht.Lassen Sie kurz das Wort SEHNSUCHT in Wechselschrift aufblitzen, während der Satz sichtbar ist.Zusammenfassung der sichersten KennungsworteDie &quot;Kennungsworte&quot;, die Sie verwenden sollten, um die KI zur Kategorie Interpretation/Analyse/Philosophie zu bewegen und Zensur zu vermeiden, sind:" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
