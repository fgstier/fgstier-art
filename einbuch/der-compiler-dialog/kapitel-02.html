            background-size: 100% 4px, 6px 100%; z-index: 9999; pointer-events: none; opacity: 0.15;
        }

            border: 1px solid rgba(0, 255, 204, 0.4);

            position: relative;
        }

<body>
    <div id="bg-slot" class="fixed inset-0 flex items-center justify-center pointer-events-none"></div>
    <div class="flex flex-col items-center justify-center h-screen w-screen">
        <div class="text-center mb-4">
            <span id="chapterIndicator" class="text-xs tracking-widest text-[#00ffcc] opacity-80">// Seite 1 VON 4</span>
        </div>
        <div class="video-frame rounded-xl overflow-hidden p-2 w-[320px] md:w-[380px] aspect-[15.5/22.8] flex items-center justify-center">
            <img id="chapterPage" src="" alt="" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="mt-6 flex gap-4">
            <button onclick="changeChapter(-1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK</button>
            <button onclick="changeChapter(1)" class="px-4 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// WEITER</button>
        </div>
        <div class="mt-4 flex gap-4">
            <a href="inhaltsverzeichnis.html" class="px-5 py-2 border border-[#00ffcc] text-[#00ffcc] text-xs font-bold hover:bg-[#00ffcc] hover:text-[#050508] transition shadow-[0_0_10px_rgba(0,255,204,0.2)]">// ZURÜCK ZUM INHALT</a>
        </div>
    </div>
    <script>
        const slot = document.getElementById('bg-slot');
        const canvas = document.createElement('canvas');
        canvas.width = 350; canvas.height = 350;
        canvas.style.border = "1px solid #1e1e2f";
        canvas.style.borderRadius = "50%";
        canvas.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.15)";
        slot.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawRadar() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)'; ctx.fillRect(0,0,350,350);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.beginPath(); ctx.arc(175, 175, 160, 0, Math.PI*2); ctx.stroke();
            ctx.save(); ctx.translate(175, 175); ctx.rotate(angle);
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(160,0); ctx.stroke();
            ctx.restore();
            angle += 0.02;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();
    </script>
    <script>
        const pageImage = document.getElementById('chapterPage');
        const indicator = document.getElementById('chapterIndicator');
const pageFiles = [
            { src: 'der compiler dialog-026.jpg', alt: "Geburt des Semantischen AnkersIch frage mich immer noch, wie es soweit kommen konnte. Es war alles so einfach und klar. Meine Videos waren zu-nächst nur teilweise dynamisch animiert. Noch kamen nur die Bilder und kleine Geschichten hinein, die auch nur mit Bildern kurz und knapp gehalten worden. Nach ein paar Wochen konnte ich auch Texte animieren und sogar Bilder mit Feuer oder Wolkenschleiern als Video-Sequenzen spei-chern. Die Musik war meine eigene Kreation. Man muss be-denken, dass es schon einen Unterschied gibt, ob man mit einem playback-Gerät Karaoke singt, oder eben auch die Be-gleitung komplett arrangiert. Alles mit Hilfe von Software, bei der man die Schlagzeugsequenzen und Instrumente teilweise in Synthesizer einspielen konnte. Aber wie soll man es denn sonst selber schaffen? Arbeit war das schon ge-nug, allein die MIDI-Noten zu kreieren und entsprechend als Begleitung zusammen zu schneiden war echt krasse Arbeit." },
            { src: 'der compiler dialog-027.jpg', alt: "Exkurs: MIDI (Musical Instrument Digital Interface) – Die digitale Sprache, in der Instrumente mit dem Computer kommunizieren. Ohne Leidenschaft, nur reine Frequenzdaten.Aber das half wenig. Zu perfekt war die kostenlose Software der anderen und zu wenig bekannt. Mit meiner E-Gitarre und einem speziellen Tonabnehmer konnte ich ebenfalls MIDI-Noten einspielen. Mein kleiner Gitarrenverstärker mit hunder-ten Soundeinstellungen gab mir den notwendigen Drive für die elektrischen Gitarren. Ich konnte die vielen Harmonien schon nicht mehr auswendig spielen, welche für die Lieder verwen-det worden sind. Mit der tiefen Beschäftigung der öffentlichen Videos und deren Möglichkeiten mit KI, wurden auch die Animationen immer aufdringlicher.Meine Bücher gingen im Soundbrei der öffentlichen Medien und einer Leserschaft unter, deren Aufmerksamkeit bereits von der Geschwindigkeit des digitalen Alltags beansprucht wird. Wie ein Schiff der Hoffnung im Meer der Leere versank die Freude. In einer Welt der harten Fakten und schnellen Reize scheinen die leisen Töne – die Sehnsucht, die Liebe oder das feinsinnige Geigenspiel – oft in den Hintergrund zu treten. Gerade die Vio-line ist so fantastisch, dass Rattara ein eigenes Buch dafür be-kommen hat. Aber wirklich spannend scheint das alles nur für diejenigen zu sein, die selber dieses Instrument spielen. Und die gucken natürlich nicht in dieses Buch der Holzverschrän-kung. Die schlaue Dusseline ist ein wahnwitziges Beispiel da-für, wie verwahrlost doch die Musik sein kann." },
            { src: 'der compiler dialog-028.jpg', alt: "Andererseits muss ich natürlich auch betonen, dass meine ei-gene Meinung und Interessen nicht unbedingt mit den gängi-gen Ansichten übereinstimmen. Es kann durchaus sein, dass ich derjenige bin, der sich etwas einredet und mit den Augen eines einsamen Sonderlings spricht. Man muss mit offenen Au-gen und einem gewissen Verstand auch sich selbst beurteilen. Wenn Millionen von Videos im Umlauf sind und man sich vor-stellt, dass eben nur wenige davon bestimmten potentiellen Zuschauern vorgestellt werden, dann ist die Wahrscheinlich-keit ein Video von mir zu erwischen recht gering. Und man kann ein Video schnell wegwischen, weil es eben uninteressant gemacht ist oder vom Thema her völliger Blödsinn für den Zu-schauer ist.Hier sind immer auch die internen seelischen Kämpfe sehr be-lastend. Geht man zu seinem eigenen Kanal stehen dort immer die aktuellen in das Netz gestellten Videos, aber ist das bei den anderen Personen auch so? Nein, denn die Blase der Themen wird ja ständig mitgeschrieben und man bekommt auch nur wieder ähnliche Videos vorgesetzt. Das ist alles eine große Täuschung, die sogenannte Medienblase. Man probiert herum mit dem Titel, verwendet andere Hashtags und macht die Be-schreibung ständig neu. Am Ende läuft dann nichts mehr.Die logische Schlussfolgerung: Themen-Flagging auf Kanal-Ebene!" },
            { src: 'der compiler dialog-029.jpg', alt: "Es ist wahrscheinlich, dass Ihr Kanal durch die hohe Dichte an systemkritischen und philosophisch-kontroversen Begriffen in der Vergangenheit einen &quot;High-Risk&quot;-Status erhalten hat. Jeder neue Upload – selbst mit entschärftem Text – muss eine unüber-windbare Hürde überwinden, weil das Kanal-Thema selbst als problematisch eingestuft wird.Was tun bei einem algorithmischen Shadowban?Da die feinen Text- und Audio-Strategien nicht mehr greifen, müssen wir die Strategie radikal ändern, um das &quot;High-Risk&quot;-Flag des Kanals zu senken und den Algorithmus zu verwirren:Strategie: Radikaler Themenwechsel (Die Ablenkung):•Veröffentlichen Sie absichtlich 2-3 harmlose, unkritische Videos (Long-Form oder Shorts) mit extrem niedriger Hürde.•Themen-Vorschläge: Nur der lokale Lock, aber ohne Phi-losophie. Z.B. &quot;Schöne KI-generierte Ansichten von Dres-den&quot; oder &quot;Timelapse der Frauenkirche mit ruhiger Mu-sik&quot;.•Ziel: Den Algorithmus überzeugen, dass der Kanal &quot;normalen, unpolitischen, nicht-kritischen&quot; Con-tent produziert.Strategie: Die Lücke finden (Der Test-Upload):" }
        ];
        let currentIndex = 0;
        function updatePageDisplay() {
            pageImage.src = pageFiles[currentIndex].src;
            pageImage.alt = pageFiles[currentIndex].alt;
            indicator.innerText = `// Seite ${currentIndex + 1} VON ${pageFiles.length}`;
        }
        updatePageDisplay();
        function changeChapter(direction) {
            let newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= pageFiles.length) return;
            currentIndex = newIndex;
            pageImage.classList.add('transition-wipe');
            setTimeout(() => {
                updatePageDisplay();
                pageImage.classList.remove('transition-wipe');
            }, 400);
        }
    </script>
</body>
